<!--
  Design: 10, Ledger (spreadsheet-native)
  Concept: D&A staff already live in Excel and eShow exports, so the results workspace is a calm, well-made workbook:
  sheet tabs for Slots, Buyers, Suppliers and Quality, a frozen header row and first column, real cell selection, and a
  formula bar that reads the selected meeting back as one plain sentence. Conditional-formatting fills carry the judgement
  (green for mutual top-10, rose for counts out of range, hatching for open slots) so problems surface without any chrome.
  Palette (OKLCH, approx hex):
    Paper  oklch(0.993 0.002 170)  #FBFDFC  page and cells
    Ink    oklch(0.255 0.018 215)  #192528  text, business tag
    Rule   oklch(0.905 0.009 200)  #D9E1E2  the grid line
    Chrome oklch(0.968 0.005 200)  #F1F5F6  row/column headers, sheet tabs
    Ledger teal (the one accent) oklch(0.47 0.085 205) #006871  selection, primary action, focus
    Fills: mutual oklch(0.945 0.045 155) on oklch(0.40 0.09 155); flag oklch(0.94 0.035 20) on oklch(0.48 0.15 25)
  Type: IBM Plex Sans (UI, cells, tabular numerals throughout) with IBM Plex Sans Condensed for grid chrome
        (column letters, row numbers, sheet tabs, header labels). Plex comes from the same lineage as the office tools staff know.
  Layout: full-height workbook. Title bar with actions, formula bar (name box + fx + sentence), toolbar (search, free-in-slot,
        filter chips, formatting rules), the sheet with a docked task pane on the right (overlay sheet on small screens),
        then sheet tabs and a status bar with selection count, sum and averages.
  shadcn components: Button, Badge, Tabs (sheet tabs), Table, DropdownMenu (column filters, Export, More), Popover
        (formatting rules), Input + InputGroup (search, name box), Select (free in slot), Sheet (detail pane), Dialog
        (run matching, lock), ToggleGroup (buyer/supplier day), Progress, Alert, Empty, Kbd, Separator, ScrollArea,
        Tooltip (title hints), sonner toast.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AW appointments, Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme inline {
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, sans-serif;
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-grid: var(--grid);
  --color-chrome: var(--chrome);
  --color-mutual: var(--mutual);
  --color-mutual-foreground: var(--mutual-foreground);
  --color-flag: var(--flag);
  --color-flag-foreground: var(--flag-foreground);
  --color-warning: var(--warning);
  --color-warning-foreground: var(--warning-foreground);
  --color-business: var(--business);
  --color-business-foreground: var(--business-foreground);
  --color-hotel: var(--hotel);
  --radius-sm: calc(var(--radius) - 2px);
  --radius-md: var(--radius);
  --radius-lg: calc(var(--radius) + 2px);
  --radius-xl: calc(var(--radius) + 6px);
}

:root {
  --radius: 0.375rem;
  --background: oklch(0.993 0.002 170);
  --foreground: oklch(0.255 0.018 215);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.255 0.018 215);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.255 0.018 215);
  --primary: oklch(0.47 0.085 205);
  --primary-foreground: oklch(0.985 0.005 200);
  --secondary: oklch(0.962 0.006 200);
  --secondary-foreground: oklch(0.255 0.018 215);
  --muted: oklch(0.965 0.005 200);
  --muted-foreground: oklch(0.50 0.018 215);
  --accent: oklch(0.95 0.022 205);
  --accent-foreground: oklch(0.32 0.06 210);
  --destructive: oklch(0.55 0.17 25);
  --border: oklch(0.89 0.010 200);
  --input: oklch(0.86 0.012 200);
  --ring: oklch(0.47 0.085 205);
  --chart-1: oklch(0.62 0.11 155);
  --chart-2: oklch(0.72 0.07 205);
  --chart-3: oklch(0.86 0.012 200);
  --chart-4: oklch(0.70 0.12 70);
  --chart-5: oklch(0.58 0.15 25);
  /* custom semantic tokens */
  --grid: oklch(0.905 0.009 200);
  --freeze: oklch(0.255 0.018 215 / 0.32);
  --chrome: oklch(0.968 0.005 200);
  --sel: oklch(0.47 0.085 205 / 0.10);
  --mutual: oklch(0.945 0.045 155);
  --mutual-foreground: oklch(0.40 0.09 155);
  --flag: oklch(0.94 0.035 20);
  --flag-foreground: oklch(0.48 0.15 25);
  --warning: oklch(0.95 0.06 85);
  --warning-foreground: oklch(0.45 0.09 70);
  --business: oklch(0.33 0.03 215);
  --business-foreground: oklch(0.985 0.005 200);
  --hotel: oklch(0.58 0.02 210);
  --hatch: oklch(0.255 0.018 215 / 0.07);
}

@layer base {
  * { border-color: var(--border); }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  mark { background: var(--warning); color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px var(--warning); }
}

@layer components {
  /* ---------- app frame ---------- */
  .lg-app { height: 100dvh; display: flex; flex-direction: column; }
  .lg-app > * { flex: none; }
  .lg-app > .lg-work { flex: 1 1 0; }
  .lg-ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Button */
  .lg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
    border-radius: var(--radius); border: 1px solid transparent; font: 500 13px/1 var(--font-sans); white-space: nowrap;
    cursor: pointer; color: var(--foreground); background: transparent; transition: background-color .12s, border-color .12s, color .12s; }
  .lg-btn .lg-ic { width: 15px; height: 15px; }
  .lg-btn[data-variant="default"] { background: var(--primary); color: var(--primary-foreground); }
  .lg-btn[data-variant="default"]:hover { background: color-mix(in oklch, var(--primary) 86%, black); }
  .lg-btn[data-variant="outline"] { background: var(--background); border-color: var(--input); }
  .lg-btn[data-variant="outline"]:hover { background: var(--accent); border-color: color-mix(in oklch, var(--primary) 30%, var(--input)); }
  .lg-btn[data-variant="ghost"]:hover { background: var(--muted); }
  .lg-btn[data-variant="link"] { height: auto; padding: 0; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklch, var(--primary) 35%, transparent); }
  .lg-btn[data-size="sm"] { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .lg-btn[data-size="icon"] { width: 32px; padding: 0; }
  .lg-btn[data-size="icon-sm"] { width: 28px; height: 28px; padding: 0; }
  .lg-btn:disabled { opacity: .45; pointer-events: none; }
  .lg-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-foreground); border-color: color-mix(in oklch, var(--primary) 35%, var(--input)); }

  /* Badge */
  .lg-badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px;
    font: 500 12px/1 var(--font-sans); white-space: nowrap; border: 1px solid var(--border); background: var(--background); color: var(--foreground); }
  .lg-badge .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
  .lg-badge[data-tone="draft"] { background: var(--warning); border-color: transparent; color: var(--warning-foreground); }
  .lg-badge[data-tone="locked"] { background: var(--mutual); border-color: transparent; color: var(--mutual-foreground); }
  .lg-badge[data-tone="edit"] { background: var(--accent); border-color: transparent; color: var(--accent-foreground); }
  .lg-badge button { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: -4px; border-radius: 999px; color: var(--muted-foreground); }
  .lg-badge button:hover { background: var(--muted); color: var(--foreground); }
  .lg-badge button .lg-ic { width: 12px; height: 12px; }

  .lg-kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--chrome); font: 500 11px/1 var(--font-cond); color: var(--muted-foreground); }

  /* ---------- title bar ---------- */
  .lg-title { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--background); }
  .lg-doc { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .lg-mark { width: 30px; height: 30px; border-radius: var(--radius); display: grid; place-items: center; flex: none;
    background: var(--primary); color: var(--primary-foreground); }
  .lg-mark .lg-ic { width: 17px; height: 17px; }
  .lg-doc h1 { font-weight: 600; font-size: 16px; letter-spacing: -0.005em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted-foreground); margin-top: 2px; }
  .lg-meta .lg-btn[data-variant="link"] { font-size: 12.5px; font-weight: 500; }
  .lg-meta .lg-btn.is-flag { color: var(--flag-foreground); text-decoration-color: color-mix(in oklch, var(--flag-foreground) 35%, transparent); }
  .lg-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .lg-more { display: none; }

  /* ---------- formula bar (the one bold element) ---------- */
  .lg-fbar { display: flex; align-items: stretch; min-height: 46px; border-bottom: 1px solid var(--border); background: var(--card); }
  .lg-namebox { width: 92px; flex: none; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border);
    font: 600 13px/1 var(--font-cond); letter-spacing: .02em; color: var(--foreground); background: var(--chrome); }
  .lg-fx { width: 40px; flex: none; display: grid; place-items: center; border-right: 1px solid var(--border);
    font: italic 500 14px/1 var(--font-sans); color: var(--primary); }
  .lg-formula { flex: 1; min-width: 0; display: block; align-self: center; padding: 8px 14px;
    font-size: 15px; line-height: 1.45; color: var(--foreground); }
  .lg-formula b { font-weight: 600; }
  .lg-formula .lg-mute { color: var(--muted-foreground); }
  .lg-formula .lg-x { color: var(--muted-foreground); padding: 0 .3em; }
  .lg-formula .lg-chip { vertical-align: 1px; }
  .lg-pair { font-variant-numeric: tabular-nums; }
  .lg-fn { color: var(--primary); font-weight: 500; margin-right: .6em; }
  .lg-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 13px; font-weight: 500;
    background: var(--muted); color: var(--muted-foreground); }
  .lg-chip-mutual { background: var(--mutual); color: var(--mutual-foreground); }
  .lg-chip-one { background: var(--accent); color: var(--accent-foreground); }
  .lg-chip-bad { background: var(--flag); color: var(--flag-foreground); }

  /* ---------- toolbar ---------- */
  .lg-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--background); }
  .lg-igroup { position: relative; display: flex; align-items: center; height: 32px; width: 300px; max-width: 100%;
    border: 1px solid var(--input); border-radius: var(--radius); background: var(--card); }
  .lg-igroup:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 18%, transparent); }
  .lg-igroup > .lg-ic { margin-left: 9px; color: var(--muted-foreground); width: 15px; height: 15px; }
  .lg-igroup input { flex: 1; min-width: 0; height: 100%; padding: 0 8px; background: transparent; font-size: 13px; outline: none; }
  .lg-igroup input::placeholder { color: var(--muted-foreground); }
  .lg-igroup .lg-addon { padding-right: 6px; display: flex; align-items: center; gap: 4px; }
  .lg-select { position: relative; display: inline-flex; align-items: center; height: 32px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--card); }
  .lg-select:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 18%, transparent); }
  .lg-select label { padding-left: 10px; font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; }
  .lg-select select { appearance: none; height: 100%; padding: 0 30px 0 6px; background: transparent; font: 500 13px var(--font-sans); outline: none; cursor: pointer; }
  .lg-select .lg-ic { position: absolute; right: 8px; pointer-events: none; color: var(--muted-foreground); width: 14px; height: 14px; }
  .lg-select.is-on { border-color: color-mix(in oklch, var(--primary) 45%, var(--input)); background: var(--accent); }
  .lg-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .lg-spacer { flex: 1; }
  .lg-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 2px; }

  /* Alert strip */
  .lg-notice { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; font-size: 13px;
    background: var(--accent); color: var(--accent-foreground); border-bottom: 1px solid color-mix(in oklch, var(--primary) 20%, var(--border)); }
  .lg-notice b { font-weight: 600; }

  /* ---------- workspace ---------- */
  .lg-work { display: flex; min-height: 0; min-width: 0; position: relative; }
  .lg-scroll { flex: 1; min-width: 0; overflow: auto; position: relative; background: var(--background); overscroll-behavior: contain; }

  /* the grid */
  .lg-grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; --rn: 48px; }
  .lg-grid th, .lg-grid td { height: 32px; padding: 0 8px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background-color: var(--background); text-align: left; font-weight: 400; }
  .lg-grid td { position: relative; cursor: cell; }
  .lg-grid td.num { text-align: right; }
  .lg-grid thead th { position: sticky; z-index: 2; background-color: var(--chrome); }
  .lg-grid .r-letters th { top: 0; height: 22px; padding: 0; text-align: center; font: 500 11px/1 var(--font-cond); color: var(--muted-foreground); }
  .lg-grid .r-fields th { top: 22px; height: 40px; padding: 0 4px 0 8px; background-color: var(--card); border-bottom: 1px solid var(--freeze);
    font: 600 12.5px/1.15 var(--font-cond); color: var(--foreground); }
  .lg-grid .rn { position: sticky; left: 0; z-index: 1; width: var(--rn); padding: 0; text-align: center; background-color: var(--chrome);
    font: 500 11px/1 var(--font-cond); color: var(--muted-foreground); }
  .lg-grid thead .rn, .lg-grid thead .corner { z-index: 4; left: 0; }
  .lg-grid .corner { position: sticky; }
  .lg-grid .fz { position: sticky; left: var(--rn); z-index: 1; border-right: 1px solid var(--freeze); }
  .lg-grid thead .fz { z-index: 3; }
  .lg-grid.is-filtered tbody .rn { color: var(--primary); font-weight: 600; }
  .lg-grid .is-hl { background-color: var(--accent) !important; color: var(--primary) !important; font-weight: 600; }
  .lg-grid .r-letters th.is-hl { box-shadow: inset 0 -2px 0 var(--primary); }
  .lg-grid tbody .rn.is-hl { box-shadow: inset -2px 0 0 var(--primary); }

  .lg-fh { display: flex; align-items: center; gap: 4px; height: 100%; }
  .lg-fh-l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .lg-fh-l small { display: block; font: 400 11.5px/1.2 var(--font-cond); color: var(--muted-foreground); }
  th.num .lg-fh { flex-direction: row-reverse; }
  th.num .lg-fh-l { text-align: right; }
  .lg-fh-b { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 4px; color: var(--muted-foreground);
    border: 1px solid transparent; cursor: pointer; }
  .lg-fh-b:hover { background: var(--muted); color: var(--foreground); border-color: var(--border); }
  .lg-fh-b .lg-ic { width: 13px; height: 13px; }
  .lg-fh-b.is-on { background: var(--primary); color: var(--primary-foreground); }

  .lg-cv { display: flex; align-items: center; gap: 6px; min-width: 0; }
  td.num .lg-cv { justify-content: flex-end; }
  .lg-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .lg-sub { color: var(--muted-foreground); }
  .lg-mute { color: var(--muted-foreground); }
  .lg-sn { font-weight: 600; min-width: 1.2em; }
  .lg-rk { flex: none; margin-left: auto; padding-left: 4px; font-size: 11.5px; color: var(--muted-foreground); }
  .lg-rk i { font-style: normal; opacity: .55; padding: 0 1px; }
  .lg-dash { color: var(--muted-foreground); }
  .lg-top { color: var(--mutual-foreground); font-weight: 600; }

  .lg-tt { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: none; border-radius: 3px; font: 600 10px/1 var(--font-cond); font-style: normal; }
  .lg-tt-business { background: var(--business); color: var(--business-foreground); }
  .lg-tt-hotel { box-shadow: inset 0 0 0 1px var(--hotel); color: var(--hotel); }

  /* conditional formatting */
  .lg-grid td.cf-good { background-color: var(--mutual); color: var(--mutual-foreground); }
  .lg-grid td.cf-good .lg-sub, .lg-grid td.cf-good .lg-rk { color: color-mix(in oklch, var(--mutual-foreground) 75%, var(--mutual)); }
  .lg-grid td.cf-bad { background-color: var(--flag); color: var(--flag-foreground); font-weight: 600; }
  .lg-grid td.cf-open { background-image: repeating-linear-gradient(135deg, transparent 0 5px, var(--hatch) 5px 6px); }
  .lg-open { font-style: italic; color: var(--muted-foreground); }
  .lg-grid td.cf-open.in-range, .lg-grid td.in-range { background-image: linear-gradient(var(--sel), var(--sel)); }
  .lg-grid td.is-active { box-shadow: inset 0 0 0 2px var(--primary); outline: none; }
  .lg-grid td.is-active::after { content: ""; position: absolute; right: 0; bottom: 0; width: 6px; height: 6px; background: var(--primary); box-shadow: 0 0 0 1px var(--background); }
  .lg-scroll:not(:focus-within) .lg-grid td.is-active { box-shadow: inset 0 0 0 2px color-mix(in oklch, var(--primary) 50%, transparent); }

  /* Empty */
  .lg-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px; max-width: 460px; margin: 0 auto; }
  .lg-empty h3 { font-weight: 600; font-size: 15px; }
  .lg-empty p { color: var(--muted-foreground); font-size: 13.5px; }
  .lg-empty-ic { width: 40px; height: 40px; border-radius: var(--radius); display: grid; place-items: center; background: var(--chrome); color: var(--muted-foreground); }

  /* ---------- detail pane (Sheet) ---------- */
  .lg-pane { width: 408px; flex: none; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: var(--card); }
  .lg-pane-h { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
  .lg-pane-h .lg-k { font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
  .lg-pane-h h2 { font-size: 17px; font-weight: 600; line-height: 1.25; margin-top: 2px; letter-spacing: -0.005em; }
  .lg-pane-h p { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
  .lg-pane-b { overflow: auto; flex: 1; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
  .lg-cells { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--grid); border-radius: var(--radius); overflow: hidden; }
  .lg-cells > div { padding: 8px 10px; border-right: 1px solid var(--grid); }
  .lg-cells > div:last-child { border-right: 0; }
  .lg-cells dt { font-size: 11.5px; color: var(--muted-foreground); font-family: var(--font-cond); }
  .lg-cells dd { font-size: 16px; font-weight: 600; margin-top: 1px; }
  .lg-cells .cf-bad { background: var(--flag); color: var(--flag-foreground); }
  .lg-cells .cf-bad dt { color: inherit; opacity: .8; }
  .lg-h3 { font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lg-st { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; border: 1px solid var(--grid); border-radius: var(--radius); overflow: hidden; table-layout: fixed; }

<script>
(() => {
'use strict';

/* ================= data ================= */
const D = window.AW_DATA;
const sheetEl = document.getElementById('sheet');
if (!D) { sheetEl.innerHTML = '<div class="lg-empty"><h3>Schedule data did not load</h3><p>Open this page from the designs folder over http so ../shared/aw-data.js can load.</p></div>'; return; }

const ST = D.event.settings;
const TOP = ST.mutualTopN;
const SLOTS = D.slots;
const NS = SLOTS.length;
const slotIdx = new Map(SLOTS.map((s, i) => [s.n, i]));
const MATCH = { mutual: `Mutual top-${TOP}`, one: `One side top-${TOP}`, neither: `Neither top-${TOP}` };
const MATCH_LC = { mutual: `mutual top-${TOP}`, one: `one side top-${TOP}`, neither: `neither top-${TOP}` };
const typeName = t => t === 'business' ? 'Business' : 'Hotel';
const inTop = r => r != null && r <= TOP;
const fmtRank = r => r == null ? '–' : String(r);
const pct = (n, d) => d ? (n / d * 100).toFixed(1) + '%' : '0.0%';
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const L = i => String.fromCharCode(65 + i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const listJoin = arr => arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

const suppliers = D.suppliers.map(s => ({ ...s, kind: 'supplier', key: 's:' + s.name, lc: s.name.toLowerCase(), slots: Array(NS).fill(null) }));
const buyers = D.buyers.map(b => ({ ...b, kind: 'buyer', key: 'b:' + b.name, lc: b.name.toLowerCase(), slots: Array(NS).fill(null) }));
const supByName = new Map(suppliers.map(s => [s.name, s]));
const buyByName = new Map(buyers.map(b => [b.name, b]));
const appts = D.appointments.map((a, i) => ({
  ...a, kind: 'appt', key: 'a:' + i,
  match: inTop(a.buyerRank) && inTop(a.supplierRank) ? 'mutual' : (inTop(a.buyerRank) || inTop(a.supplierRank)) ? 'one' : 'neither',
  slotObj: SLOTS[slotIdx.get(a.slot)], B: buyByName.get(a.buyer), S: supByName.get(a.supplier),
})).filter(a => a.B && a.S && a.slotObj);
appts.forEach(a => { const i = slotIdx.get(a.slot); a.B.slots[i] = a; a.S.slots[i] = a; });
[...buyers, ...suppliers].forEach(p => {
  p.count = p.slots.filter(Boolean).length;
  p.mutual = p.slots.filter(a => a && a.match === 'mutual').length;
  p.open = SLOTS.filter((s, i) => !p.slots[i]).map(s => s.n);
});
buyers.forEach(b => { b.health = b.count < ST.buyerMin ? 'low' : b.count > ST.buyerMax ? 'high' : 'ok'; });
suppliers.forEach(s => { s.health = s.count === ST.supplierTarget ? 'ok' : s.count < ST.supplierTarget ? 'low' : 'high'; });
const orgCount = {}; buyers.forEach(b => { orgCount[b.organization] = (orgCount[b.organization] || 0) + 1; });
const sharedOrg = o => orgCount[o] > 1;
const byKey = new Map([...appts, ...buyers, ...suppliers].map(x => [x.key, x]));

const Q = (() => {
  const total = appts.length;
  const n = m => appts.filter(a => a.match === m).length;
  const blankB = appts.filter(a => a.buyerRank == null).length;
  const blankS = appts.filter(a => a.supplierRank == null).length;
  const dist = new Map();
  buyers.forEach(b => dist.set(b.count, (dist.get(b.count) || 0) + 1));
  const counts = buyers.map(b => b.count);
  const lo = Math.min(ST.buyerMin, ...counts), hi = Math.max(ST.buyerMax, ...counts);
  return {
    total, mutual: n('mutual'), one: n('one'), neither: n('neither'), blankB, blankS,
    blankAppts: appts.filter(a => a.buyerRank == null || a.supplierRank == null).length,
    supOk: suppliers.filter(s => s.health === 'ok').length,
    buyOk: buyers.filter(b => b.health === 'ok').length,
    low: buyers.filter(b => b.health === 'low').sort((a, b) => a.count - b.count || a.name.localeCompare(b.name)),
    high: buyers.filter(b => b.health === 'high').sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)),
    supOff: suppliers.filter(s => s.health !== 'ok'),
    dist, lo, hi,
  };
})();
const ISSUES = Q.low.length + Q.high.length + Q.supOff.length;

/* ================= state ================= */
const S = {
  sheet: 'slots', q: '', freeSlot: null, locked: false, editing: false,

/* ================= small renderers ================= */
function hl(text) {
  const t = String(text ?? '');
  if (!S.q) return esc(t);
  const lc = t.toLowerCase(), q = S.q;
  let out = '', i = 0, j;
  while ((j = lc.indexOf(q, i)) !== -1) { out += esc(t.slice(i, j)) + '<mark>' + esc(t.slice(j, j + q.length)) + '</mark>'; i = j + q.length; }
  return out + esc(t.slice(i));
}
const tt = type => `<i class="lg-tt lg-tt-${type}" role="img" aria-label="${typeName(type)}">${type === 'business' ? 'B' : 'H'}</i>`;
const rk = a => `<span class="lg-rk" aria-label="Buyer rank ${fmtRank(a.buyerRank)}, supplier rank ${fmtRank(a.supplierRank)}">${fmtRank(a.buyerRank)}<i>/</i>${fmtRank(a.supplierRank)}</span>`;
const buyerCell = b => `<span class="lg-cv"><span class="lg-t">${hl(b.organization)} <span class="lg-sub">${hl(b.title)}</span></span></span>`;
const supCell = s => `<span class="lg-cv">${tt(s.type)}<span class="lg-t">${hl(s.name)}</span></span>`;
const rankCell = r => r == null ? { h: '<span class="lg-dash" aria-label="Blank">–</span>' } : { h: String(r), c: inTop(r) ? 'lg-top' : '' };
const slotLabel = s => `Slot ${s.n}, ${s.start}`;
const healthChip = p => {
  if (p.kind === 'buyer') {
    if (p.health === 'low') return `<span class="lg-chip lg-chip-bad">${ST.buyerMin - p.count} below the minimum of ${ST.buyerMin}</span>`;
    if (p.health === 'high') return `<span class="lg-chip lg-chip-bad">${p.count - ST.buyerMax} above the maximum of ${ST.buyerMax}</span>`;
    return '';
  }
  return p.health === 'ok' ? '' : `<span class="lg-chip lg-chip-bad">${Math.abs(p.count - ST.supplierTarget)} off the target of ${ST.supplierTarget}</span>`;
};

/* Formula bar sentences */
function apptFx(a) {
  const org = `<b>${esc(a.B.organization)}</b>${sharedOrg(a.B.organization) ? ` <span class="lg-mute">(${esc(a.B.title)})</span>` : ''}`;
  return `<span>Slot ${a.slot}, ${a.slotObj.start}, Desk ${a.desk}, </span><b>${esc(a.supplier)}</b><span class="lg-x">×</span>${org}<span>, </span><span class="lg-pair">B:${fmtRank(a.buyerRank)} S:${fmtRank(a.supplierRank)}</span><span>, </span><span class="lg-chip lg-chip-${a.match}">${MATCH_LC[a.match]}</span>`;
}
function personFx(p) {
  const name = p.kind === 'buyer' ? `<b>${esc(p.organization)}</b><span class="lg-mute">, ${esc(p.title)}</span>` : `<b>${esc(p.name)}</b><span>, Desk ${p.desk}, ${typeName(p.type).toLowerCase()}</span>`;
  const open = p.open.length ? `open in ${p.open.length === 1 ? 'slot' : 'slots'} ${listJoin(p.open.map(String))}` : 'no open slots';
  const chip = healthChip(p);
  return `${name}<span>, ${plural(p.count, 'meeting')}, ${p.mutual} mutual top-${TOP}, ${open}${chip ? ', ' : ''}</span>${chip}`;
}
function openFx(p, s) {
  const who = p.kind === 'buyer' ? esc(p.organization) : esc(p.name);
  return `<span>Slot ${s.n}, ${s.start}, </span><span class="lg-chip">open</span><span>. </span><b>${who}</b><span> has no meeting in this slot. ${p.count} of ${NS} slots booked.</span>`;
}
function rowRange(sh, row) {
  const first = sh.cols.findIndex(c => c.slot), last = first + NS - 1;
  return `${L(first)}${row._n}:${L(last)}${row._n}`;
}
function countFx(sh, p) {
  let note;
  if (p.kind === 'buyer') note = p.health === 'ok' ? `Within ${ST.buyerMin} to ${ST.buyerMax}.` : p.health === 'low' ? `${ST.buyerMin - p.count} below the minimum of ${ST.buyerMin}.` : `${p.count - ST.buyerMax} above the maximum of ${ST.buyerMax}.`;
  else note = p.health === 'ok' ? `On the target of ${ST.supplierTarget}.` : `${Math.abs(p.count - ST.supplierTarget)} off the target of ${ST.supplierTarget}.`;
  return `<span class="lg-fn">=COUNTA(${rowRange(sh, p)})</span><span>${plural(p.count, 'meeting')}. ${note}</span>`;
}
const mutualFx = (sh, p) => `<span class="lg-fn">=COUNTIF(${rowRange(sh, p)},"${MATCH.mutual}")</span><span>${plural(p.mutual, 'mutual top-' + TOP + ' meeting')}.</span>`;

/* Panel targets */
const tA = a => ({ kind: 'appt', key: a.key });
const tE = (p, slot) => ({ kind: p.kind, key: p.key, slot: slot ?? null });

/* ================= sheet definitions ================= */
function slotCol(s, i, kind) {
  return {
    id: 's' + s.n, slot: s.n, label: `Slot ${s.n}`, sub: s.start, w: 184, wm: 156,
    cell: p => {
      const a = p.slots[i];
      if (!a) return { h: '<span class="lg-open">Open</span>', c: 'cf-open' };
      const inner = kind === 'buyer'
        ? `${tt(a.type)}<span class="lg-t">${hl(a.supplier)}</span>`
        : `<span class="lg-t">${hl(a.B.organization)}${sharedOrg(a.B.organization) ? ` <span class="lg-sub">${hl(a.B.title)}</span>` : ''}</span>`;
      return { h: `<span class="lg-cv">${inner}${rk(a)}</span>`, c: a.match === 'mutual' ? 'cf-good' : '' };
    },
    val: p => p.slots[i] ? MATCH[p.slots[i].match] : 'Open',
    order: ['Open', MATCH.mutual, MATCH.one, MATCH.neither],
    sv: p => p.slots[i] ? (kind === 'buyer' ? p.slots[i].supplier : p.slots[i].B.name) : null,
    go: p => p.slots[i] ? tA(p.slots[i]) : tE(p, s.n),
    ap: p => p.slots[i],
    fx: (sh, p) => p.slots[i] ? apptFx(p.slots[i]) : openFx(p, s),
  };
}

const SHEETS = {
  slots: {

        val: a => slotLabel(a.slotObj), order: SLOTS.map(slotLabel), sv: a => a.slot * 1000 + a.desk },

      { id: 'type', label: 'Type', w: 104, cell: a => ({ h: `<span class="lg-cv">${tt(a.type)}<span>${typeName(a.type)}</span></span>` }), val: a => typeName(a.type), sv: a => a.type },
      { id: 'buyer', label: 'Buyer', w: 340, cell: a => ({ h: buyerCell(a.B) }), val: a => a.B.organization, sv: a => a.B.name, go: a => tE(a.B, a.slot) },
      { id: 'brank', label: 'Buyer rank', num: true, w: 92, cell: a => rankCell(a.buyerRank), val: a => a.buyerRank == null ? '(Blanks)' : String(a.buyerRank), sv: a => a.buyerRank, nv: a => a.buyerRank },
      { id: 'srank', label: 'Supplier rank', num: true, w: 104, cell: a => rankCell(a.supplierRank), val: a => a.supplierRank == null ? '(Blanks)' : String(a.supplierRank), sv: a => a.supplierRank, nv: a => a.supplierRank },
      { id: 'match', label: 'Match', w: 148, cell: a => ({ h: a.match === 'neither' ? `<span class="lg-mute">${MATCH[a.match]}</span>` : MATCH[a.match], c: a.match === 'mutual' ? 'cf-good' : '' }),
        val: a => MATCH[a.match], order: [MATCH.mutual, MATCH.one, MATCH.neither], sv: a => ['mutual', 'one', 'neither'].indexOf(a.match) },
    ],
  },
  buyers: {
    id: 'buyers', label: 'Buyers', rowNoun: 'buyers',
    base: [...buyers],
    search: (b, q) => b.lc.includes(q) || b.slots.some(a => a && a.S.lc.includes(q)),
    free: (b, n) => !b.slots[slotIdx.get(n)],
    rowGo: b => tE(b), rowFx: (sh, b) => personFx(b), rowAp: () => null,
    cols: [
      { id: 'buyer', label: 'Buyer', w: 300, wm: 150, cell: b => ({ h: buyerCell(b) }), val: b => b.organization, sv: b => b.name },
      { id: 'count', label: 'Meetings', num: true, w: 92, cell: b => ({ h: String(b.count), c: b.health === 'ok' ? '' : 'cf-bad' }), val: b => String(b.count), sv: b => b.count, nv: b => b.count, fx: countFx },
      { id: 'mutual', label: 'Mutual', num: true, w: 80, cell: b => ({ h: b.mutual ? String(b.mutual) : '<span class="lg-mute">0</span>' }), val: b => String(b.mutual), sv: b => b.mutual, nv: b => b.mutual, fx: mutualFx },
      ...SLOTS.map((s, i) => slotCol(s, i, 'buyer')),
    ],

  suppliers: {
    id: 'suppliers', label: 'Suppliers', rowNoun: 'suppliers',
    base: [...suppliers].sort((a, b) => a.desk - b.desk),
    search: (s, q) => s.lc.includes(q) || s.slots.some(a => a && a.B.lc.includes(q)),
    free: (s, n) => !s.slots[slotIdx.get(n)],
    rowGo: s => tE(s), rowFx: (sh, s) => personFx(s), rowAp: () => null,
    cols: [
      { id: 'supplier', label: 'Supplier', w: 280, wm: 150, cell: s => ({ h: supCell(s) }), val: s => s.name, sv: s => s.name },
      { id: 'desk', label: 'Desk', num: true, w: 66, cell: s => ({ h: String(s.desk) }), val: s => String(s.desk), sv: s => s.desk },
      { id: 'type', label: 'Type', w: 104, cell: s => ({ h: `<span class="lg-cv">${tt(s.type)}<span>${typeName(s.type)}</span></span>` }), val: s => typeName(s.type), sv: s => s.type },
      { id: 'count', label: 'Meetings', num: true, w: 92, cell: s => ({ h: String(s.count), c: s.health === 'ok' ? '' : 'cf-bad' }), val: s => String(s.count), sv: s => s.count, nv: s => s.count, fx: countFx },
      { id: 'mutual', label: 'Mutual', num: true, w: 80, cell: s => ({ h: s.mutual ? String(s.mutual) : '<span class="lg-mute">0</span>' }), val: s => String(s.mutual), sv: s => s.mutual, nv: s => s.mutual, fx: mutualFx },
      ...SLOTS.map((s, i) => slotCol(s, i, 'supplier')),

Object.values(SHEETS).forEach(sh => {
  sh.base.forEach((r, i) => { r._n = i + 2; });
  sh.colById = Object.fromEntries(sh.cols.map(c => [c.id, c]));
  sh.frozen = 1;
});
const colRef = (sheet, id) => { const sh = SHEETS[sheet]; const i = sh.cols.findIndex(c => c.id === id); return `${sh.label}!${L(i)}2:${L(i)}${sh.base.length + 1}`; };

/* ================= filtering ================= */
function cmp(a, b) {
  if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
  return typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b));
}
function visibleRows(id) {
  const sh = SHEETS[id];
  let rows = sh.base;
  if (S.q) rows = rows.filter(r => sh.search(r, S.q));
  if (S.freeSlot != null) rows = rows.filter(r => sh.free(r, S.freeSlot));
  for (const [cid, set] of Object.entries(S.filters[id])) { const col = sh.colById[cid]; rows = rows.filter(r => set.has(col.val(r))); }
  const so = S.sort[id];
  if (so) { const col = sh.colById[so.col]; rows = [...rows].sort((a, b) => { const x = col.sv(a), y = col.sv(b); if (x == null || y == null) return cmp(x, y); return cmp(x, y) * so.dir; }); }
  return rows;
}
const isFiltered = id => !!S.q || S.freeSlot != null || Object.keys(S.filters[id] || {}).length > 0;

/* ================= grid (shared by Slots, Buyers, Suppliers) ================= */
function renderGrid(sh) {
  const cols = sh.cols, rows = visibleRows(sh.id), small = mqSmall.matches;
  V.sheet = sh.id; V.rows = rows; V.cols = cols;
  const width = (small ? 36 : 48) + cols.reduce((t, c) => t + (small && c.wm ? c.wm : c.w), 0);
  const so = S.sort[sh.id];
  let h = `<table class="lg-grid${isFiltered(sh.id) ? ' is-filtered' : ''}" data-slot="table" role="grid" aria-label="${sh.label} sheet" aria-rowcount="${rows.length + 1}" aria-colcount="${cols.length}" aria-multiselectable="true" style="width:${width}px">`;
  h += `<colgroup><col style="width:var(--rn)">${cols.map(c => `<col style="width:${small && c.wm ? c.wm : c.w}px">`).join('')}</colgroup>`;
  h += `<thead data-slot="table-header"><tr class="r-letters" aria-hidden="true"><th class="corner rn"></th>${cols.map((c, i) => `<th class="lg-letter${i < sh.frozen ? ' fz' : ''}" data-lc="${i}">${L(i)}</th>`).join('')}</tr>`;
  h += `<tr class="r-fields" role="row"><th class="rn" aria-hidden="true">1</th>${cols.map((c, i) => {
    const filt = !!S.filters[sh.id][c.id] || (c.slot && S.freeSlot === c.slot);
    const sorted = so && so.col === c.id;
    const icon = filt ? 'filter' : sorted ? (so.dir > 0 ? 'up' : 'down') : 'chev';
    return `<th role="columnheader" scope="col" class="${i < sh.frozen ? 'fz ' : ''}${c.num ? 'num' : ''}" ${sorted ? `aria-sort="${so.dir > 0 ? 'ascending' : 'descending'}"` : ''} data-slot="table-head">
      <div class="lg-fh"><span class="lg-fh-l">${esc(c.label)}${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</span>
      <button class="lg-fh-b${filt || sorted ? ' is-on' : ''}" data-slot="dropdown-menu-trigger" data-col="${i}" aria-haspopup="menu" aria-expanded="false" aria-label="Sort and filter ${esc(c.label)}${c.sub ? ', ' + esc(c.sub) : ''}${filt ? ' (filtered)' : ''}" title="Sort and filter">${ic(icon)}</button></div></th>`;
  }).join('')}</tr></thead><tbody data-slot="table-body">`;
  const parts = [];
  rows.forEach((row, r) => {
    let tr = `<tr role="row" data-slot="table-row"><th class="rn" scope="row" data-rn="${r}">${row._n}</th>`;
    cols.forEach((c, ci) => {
      const o = c.cell(row);
      tr += `<td role="gridcell" data-slot="table-cell" data-r="${r}" data-c="${ci}" tabindex="-1" class="${ci < sh.frozen ? 'fz ' : ''}${c.num ? 'num ' : ''}${o.c || ''}">${o.h}</td>`;
    });
    parts.push(tr + '</tr>');
  });
  h += parts.join('') + '</tbody></table>';
  if (!rows.length) h += emptyHTML(sh);
  sheetEl.innerHTML = h;
  const trs = sheetEl.querySelectorAll('tbody tr');
  V.tds = Array.from(trs, tr => Array.from(tr.children).slice(1));
  V.rns = Array.from(trs, tr => tr.firstElementChild);
  V.letters = Array.from(sheetEl.querySelectorAll('.lg-letter'));
  V.painted = [];
  const s = S.sel[sh.id];
  s.r = Math.max(0, Math.min(s.r, rows.length - 1)); s.c = Math.max(0, Math.min(s.c, cols.length - 1));
  s.ar = Math.max(0, Math.min(s.ar, rows.length - 1)); s.ac = Math.max(0, Math.min(s.ac, cols.length - 1));
  paintSel();
}

function emptyHTML(sh) {
  const why = [];
  if (S.q) why.push(`match “${esc(S.q)}”`);
  if (S.freeSlot != null) why.push(`are free in slot ${S.freeSlot}`);
  if (Object.keys(S.filters[sh.id]).length) why.push('pass the column filters');
  let hint = 'Clear the search or filters to see every row again.';
  if (S.freeSlot != null && sh.id === 'suppliers') hint = `Every supplier is booked in slot ${S.freeSlot}. To add a meeting here, swap it with an existing meeting in another slot.`;
  return `<div class="lg-empty" data-slot="empty"><div class="lg-empty-ic">${ic('filter')}</div><h3>No ${sh.rowNoun} ${listJoin(why) || 'to show'}</h3><p>${hint}</p><button class="lg-btn" data-slot="button" data-variant="outline" data-size="sm" data-act="clear-all">Clear search and filters</button></div>`;
}

/* selection */
function rangeOf(s) { return { r0: Math.min(s.r, s.ar), r1: Math.max(s.r, s.ar), c0: Math.min(s.c, s.ac), c1: Math.max(s.c, s.ac) }; }
function paintSel() {
  V.painted.forEach(el => { el.classList.remove('in-range', 'is-active', 'is-hl'); if (el.tagName === 'TD') { el.tabIndex = -1; el.removeAttribute('aria-selected'); } });
  V.painted = [];
  if (!V.rows.length) return;
  const s = S.sel[V.sheet], g = rangeOf(s);
  const add = (el, cls) => { el.classList.add(cls); V.painted.push(el); };
  const multi = g.r0 !== g.r1 || g.c0 !== g.c1;
  if (multi) for (let r = g.r0; r <= g.r1; r++) for (let c = g.c0; c <= g.c1; c++) { const td = V.tds[r][c]; add(td, 'in-range'); td.setAttribute('aria-selected', 'true'); }
  const td = V.tds[s.r][s.c];
  add(td, 'is-active'); td.tabIndex = 0; td.setAttribute('aria-selected', 'true');
  for (let r = g.r0; r <= g.r1; r++) add(V.rns[r], 'is-hl');
  for (let c = g.c0; c <= g.c1; c++) add(V.letters[c], 'is-hl');
}
function setSel(r, c, extend, opt = {}) {
  if (!V.rows.length) return;
  const s = S.sel[V.sheet];
  s.r = Math.max(0, Math.min(r, V.rows.length - 1));
  s.c = Math.max(0, Math.min(c, V.cols.length - 1));
  if (!extend) { s.ar = s.r; s.ac = s.c; }
  paintSel(); updateFormula(); updateStatus();
  const td = V.tds[s.r][s.c];
  if (opt.focus !== false) { td.focus({ preventScroll: true }); td.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  if (P.open && mqDock.matches && !extend) openPanel(targetAt(s.r, s.c), { follow: true });
}
const targetAt = (r, c) => { const sh = SHEETS[V.sheet], col = V.cols[c], row = V.rows[r]; return (col.go || sh.rowGo)(row); };

/* ================= formula bar + status ================= */
const nameBox = document.getElementById('nameBox');
const formulaEl = document.getElementById('formula');
function updateFormula() {
  if (S.sheet === 'quality') {
    const m = S.qSel && QFX[S.qSel];
    nameBox.textContent = m ? m.ref : 'Quality';
    formulaEl.innerHTML = m ? m.fx : `<span class="lg-mute">Select a figure to see how it is worked out from the ${Q.total} appointments.</span>`;
    return;
  }
  const sh = SHEETS[S.sheet];
  if (!V.rows.length) { nameBox.textContent = '–'; formulaEl.innerHTML = '<span class="lg-mute">No rows to show with the current search and filters.</span>'; return; }
  const s = S.sel[S.sheet], g = rangeOf(s), row = V.rows[s.r], col = V.cols[s.c];
  const multi = g.r0 !== g.r1 || g.c0 !== g.c1;
  nameBox.textContent = multi ? `${L(g.c0)}${V.rows[g.r0]._n}:${L(g.c1)}${V.rows[g.r1]._n}` : `${L(s.c)}${row._n}`;
  formulaEl.innerHTML = (col.fx || sh.rowFx)(sh, row);
}
const statusEl = document.getElementById('status');
function updateStatus() {
  if (S.sheet === 'quality') {
    statusEl.innerHTML = `<span class="lg-opt">Computed from<b>${Q.total} appointments</b></span><span>Manual changes<b>${D.event.manualChanges}</b></span>`;
    return;
  }
  const sh = SHEETS[S.sheet], all = sh.base.length, n = V.rows.length;
  let h = `<span class="${isFiltered(S.sheet) ? 'is-filtered' : ''}">${n === all ? `${all} ${sh.rowNoun}` : `${n} of ${all} ${sh.rowNoun} shown`}</span>`;
  if (n) {
    const s = S.sel[S.sheet], g = rangeOf(s);
    const cells = (g.r1 - g.r0 + 1) * (g.c1 - g.c0 + 1);
    if (cells > 1) {
      const ap = new Map(), nums = [];
      for (let r = g.r0; r <= g.r1; r++) for (let c = g.c0; c <= g.c1; c++) {
        const col = V.cols[c], row = V.rows[r];
        const a = (col.ap || sh.rowAp)(row); if (a) ap.set(a.key, a);
        if (col.nv) { const v = col.nv(row); if (v != null) nums.push(v); }
      }
      const list = [...ap.values()];
      const avg = arr => arr.length ? (arr.reduce((t, x) => t + x, 0) / arr.length).toFixed(1) : '–';
      if (list.length) {
        h += `<span>Meetings<b>${list.length}</b></span><span>Mutual top-${TOP}<b>${list.filter(a => a.match === 'mutual').length}</b></span>`;
        h += `<span class="lg-opt">Avg buyer rank<b>${avg(list.map(a => a.buyerRank).filter(x => x != null))}</b></span><span class="lg-opt">Avg supplier rank<b>${avg(list.map(a => a.supplierRank).filter(x => x != null))}</b></span>`;
      }
      if (nums.length) h += `<span>Sum<b>${nums.reduce((t, x) => t + x, 0)}</b></span><span class="lg-opt">Average<b>${avg(nums)}</b></span>`;
      if (!list.length && !nums.length) h += `<span>Count<b>${cells}</b></span>`;
    } else {
      h += `<span class="lg-opt lg-hide-sm">Shift + arrows selects a range</span><span class="lg-opt lg-hide-sm"><kbd class="lg-kbd" data-slot="kbd">Enter</kbd> opens details</span>`;
    }
  }
  statusEl.innerHTML = h;
}

let QFX = {};
function renderQuality() {
  V.sheet = 'quality'; V.rows = []; V.cols = [];

    sup: { ref: 'Quality!B3', fx: `<span class="lg-fn">=COUNTIF(${supRange},${ST.supplierTarget})</span><span>${Q.supOk} of ${suppliers.length} suppliers have exactly ${ST.supplierTarget} meetings.</span>` },
    buy: { ref: 'Quality!B4', fx: `<span class="lg-fn">=COUNTIFS(${buyRange},"&gt;=${ST.buyerMin}",${buyRange},"&lt;=${ST.buyerMax}")</span><span>${Q.buyOk} of ${buyers.length} buyers have ${ST.buyerMin} to ${ST.buyerMax} meetings.</span>` },
    mutual: { ref: 'Quality!B5', fx: `<span class="lg-fn">=COUNTIF(${matchRange},"${MATCH.mutual}")</span><span>${Q.mutual} meetings, ${pct(Q.mutual, total)}, where both sides ranked each other ${TOP} or better.</span>` },
    one: { ref: 'Quality!B6', fx: `<span class="lg-fn">=COUNTIF(${matchRange},"${MATCH.one}")</span><span>${Q.one} meetings, ${pct(Q.one, total)}, where only one side ranked the other ${TOP} or better.</span>` },
    neither: { ref: 'Quality!B7', fx: `<span class="lg-fn">=COUNTIF(${matchRange},"${MATCH.neither}")</span><span>${Q.neither} meetings, ${pct(Q.neither, total)}, where neither side ranked the other in its top ${TOP}.</span>` },
    blank: { ref: 'Quality!B8', fx: `<span class="lg-fn">=COUNTBLANK(${brRange})+COUNTBLANK(${srRange})</span><span>${Q.blankB + Q.blankS} blank ranks: ${Q.blankB} left blank by buyers, ${Q.blankS} by suppliers.</span>` },
    manual: { ref: 'Quality!B9', fx: `<span>${D.event.manualChanges} manual changes applied since the last matching run.</span>` },
  };
  const row = (id, label, value, extra, cls = '') => `<tr tabindex="0" data-qfx="${id}" class="${S.qSel === id ? 'is-sel' : ''}"><td>${label}</td><td class="num lg-big ${cls}">${value}</td><td>${extra}</td></tr>`;
  const prog = (n, d, bad) => `<div class="flex items-center gap-2"><div class="lg-prog flex-1${bad ? ' is-bad' : ''}" data-slot="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${d}" aria-valuenow="${n}"><div style="width:${d ? n / d * 100 : 0}%"></div></div><span class="text-muted-foreground text-xs">${pct(n, d)}</span></div>`;
  const share = n => `<div class="flex items-center gap-2"><div class="lg-bar" style="width:${Math.max(2, n / total * 160)}px"></div><span class="text-muted-foreground text-xs">${pct(n, total)}</span></div>`;

  const health = `<section class="lg-sec" aria-labelledby="q-health"><header><h2 id="q-health">Schedule health</h2><p>Every figure is counted from the Slots, Buyers and Suppliers sheets. Select one to see its formula.</p></header>
    <table class="lg-qt" data-slot="table"><colgroup><col><col style="width:96px"><col style="width:42%"></colgroup>
    <thead><tr><th>Measure</th><th class="num">Value</th><th>Share</th></tr></thead><tbody>
    ${row('total', 'Total appointments', total, `<span class="text-muted-foreground">${NS} slots, ${suppliers.length} desks</span>`)}
    ${row('sup', `Suppliers at ${ST.supplierTarget}`, `${Q.supOk}/${suppliers.length}`, prog(Q.supOk, suppliers.length, Q.supOk < suppliers.length), Q.supOk < suppliers.length ? 'cf-bad' : '')}
    ${row('buy', `Buyers at ${ST.buyerMin} to ${ST.buyerMax}`, `${Q.buyOk}/${buyers.length}`, prog(Q.buyOk, buyers.length, Q.buyOk < buyers.length), Q.buyOk < buyers.length ? 'cf-bad' : '')}
    ${row('mutual', `Mutual top-${TOP}`, Q.mutual, share(Q.mutual), 'cf-good')}
    ${row('one', `One side top-${TOP}`, Q.one, share(Q.one))}
    ${row('neither', `Neither top-${TOP}`, Q.neither, share(Q.neither))}
    ${row('blank', 'Blank rankings', Q.blankB + Q.blankS, `<span class="text-muted-foreground">${Q.blankB} by buyers, ${Q.blankS} by suppliers</span>`)}
    ${row('manual', 'Manual changes', D.event.manualChanges, `<span class="text-muted-foreground">${D.event.manualChanges} manual changes applied</span>`)}
    </tbody></table></section>`;

  const maxN = Math.max(...Q.dist.values());
  let distRows = '';
  for (let c = Q.lo; c <= Q.hi; c++) {
    const n = Q.dist.get(c) || 0;
    const bad = c < ST.buyerMin || c > ST.buyerMax;
    const note = c < ST.buyerMin ? 'Below minimum' : c > ST.buyerMax ? 'Above maximum' : c === ST.buyerIdeal ? 'Ideal' : 'In range';
    distRows += `<tr ${n ? `tabindex="0" data-act="buyers-count" data-count="${c}"` : ''} aria-label="${plural(n, 'buyer')} with ${c} meetings, ${note.toLowerCase()}${n ? '. Show them on the Buyers sheet' : ''}">
      <td class="num ${bad ? 'cf-bad' : ''}">${c}</td><td class="num">${n}</td><td><div class="lg-bar${bad ? ' is-bad' : ''}" style="width:${n ? Math.max(3, n / maxN * 100) : 0}%"></div></td><td class="${bad ? 'text-destructive' : 'text-muted-foreground'}">${note}</td></tr>`;

      <td class="num">${fb ? `<button class="lg-btn" data-variant="link" data-act="free-buyers" data-slotn="${s.n}" aria-label="Show ${fb} buyers free in slot ${s.n}">${fb}</button>` : '<span class="text-muted-foreground">0</span>'}</td></tr>`;
  }).join('');
  const slotsSec = `<section class="lg-sec" aria-labelledby="q-slots"><header><h2 id="q-slots">Match quality by slot</h2><p>Free buyers are where a meeting can still be added.</p></header>
    <div class="lg-legend" data-slot="chart-legend"><span><i style="background:var(--chart-1)"></i>${MATCH.mutual}</span><span><i style="background:var(--chart-2)"></i>${MATCH.one}</span><span><i style="background:var(--chart-3)"></i>${MATCH.neither}</span></div>
    <table class="lg-qt" data-slot="table"><colgroup><col style="width:108px"><col style="width:80px"><col style="width:64px"><col><col style="width:88px"></colgroup>

  const listTable = (id, title, desc, list, empty) => `<section class="lg-sec" aria-labelledby="${id}"><header><h2 id="${id}">${title}</h2><p>${desc}</p></header>

  sheetEl.innerHTML = `<div class="lg-report">${health}${dist}
    ${listTable('q-low', `Buyers below ${ST.buyerMin}`, Q.low.length ? `${plural(Q.low.length, 'buyer needs', 'buyers need')} more meetings. Their open slots are where to add them.` : `Every buyer has at least ${ST.buyerMin} meetings.`, Q.low, `No buyers are below ${ST.buyerMin} meetings.`)}

function switchSheet(id, focusTab) {

/* ================= detail pane (Sheet) ================= */

const backdrop = document.getElementById('backdrop');
let paneReturn = null;
function openPanel(t, opt = {}) {
  if (!t) return;
  if (opt.push && P.cur) P.stack.push(P.cur); else if (!opt.push) P.stack = [];
  if (!opt.follow) paneReturn = document.activeElement;
  P.cur = t; P.open = true;
  renderPanel(); layoutPanel();
  if (opt.focus || !mqDock.matches) paneEl.querySelector('[data-autofocus]')?.focus();
}

  P.open = false; P.stack = []; layoutPanel();

}
function layoutPanel() {
  paneEl.hidden = !P.open;

  paneEl.setAttribute('aria-modal', String(overlay));

}

    }
    const who = isBuyer ? `<span class="lg-cv">${tt(a.type)}<span class="lg-t">${esc(a.supplier)}</span></span>`

/* ================= floating layer: DropdownMenu + Popover ================= */
const floatEl = document.getElementById('float');
let floatAnchor = null, floatHandlers = [];
function placeFloat(anchor, align) {
  floatEl.hidden = false;
  const r = anchor.getBoundingClientRect(), w = floatEl.offsetWidth, h = floatEl.offsetHeight;
  let x = align === 'end' ? r.right - w : r.left;
  x = Math.max(8, Math.min(x, innerWidth - w - 8));
  let y = r.bottom + 4;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 4);
  floatEl.style.left = x + 'px'; floatEl.style.top = y + 'px';
}
function openFloat(anchor, html, { role = 'menu', label = '', align = 'start', handlers = [], focus = true } = {}) {
  closeFloat(false);
  floatHandlers = handlers; floatAnchor = anchor;
  floatEl.setAttribute('role', role);
  floatEl.setAttribute('data-slot', role === 'menu' ? 'dropdown-menu-content' : 'popover-content');
  floatEl.setAttribute('aria-label', label);
  floatEl.innerHTML = html;
  anchor.setAttribute('aria-expanded', 'true');
  placeFloat(anchor, align);
  if (focus) (floatEl.querySelector('[data-autofocus]') || floatEl.querySelector('[data-mi]'))?.focus();
}
function closeFloat(refocus = true) {
  if (floatEl.hidden) return;
  floatEl.hidden = true; floatEl.innerHTML = '';
  if (floatAnchor) {
    floatAnchor.setAttribute('aria-expanded', 'false');
    let target = floatAnchor;
    if (!document.contains(target) && target.dataset.col) target = sheetEl.querySelector(`.lg-fh-b[data-col="${target.dataset.col}"]`);
    if (refocus) target?.focus();
  }
  floatAnchor = null;
}
const mItem = (i, label, { icon, kind = 'item', checked, count, extra = '' } = {}) => {
  const role = kind === 'checkbox' ? 'menuitemcheckbox' : kind === 'radio' ? 'menuitemradio' : 'menuitem';
  const lead = kind === 'item' ? (icon ? ic(icon) : '') : `<span class="lg-cb" aria-hidden="true">${ic('check')}</span>`;
  return `<button class="lg-mi" data-slot="dropdown-menu-${kind === 'item' ? 'item' : kind + '-item'}" role="${role}" data-mi="${i}" tabindex="-1" ${kind !== 'item' ? `aria-checked="${checked}"` : ''} ${extra}>${lead}<span class="lg-mi-t">${esc(label)}</span>${count != null ? `<span class="lg-mi-n">${count}</span>` : ''}</button>`;
};

function openColMenu(btn) {
  const sh = SHEETS[S.sheet], ci = +btn.dataset.col, col = sh.cols[ci];
  const H = [];
  const add = fn => (H.push(fn), H.length - 1);
  const so = S.sort[sh.id];
  const sortA = col.num ? 'Sort smallest to largest' : 'Sort A to Z', sortD = col.num ? 'Sort largest to smallest' : 'Sort Z to A';
  let html = `<div data-slot="dropdown-menu-group" role="group" aria-label="Sort"><div class="lg-mlabel" data-slot="dropdown-menu-label">${esc(col.label)}${col.sub ? ', ' + esc(col.sub) : ''}</div>`;
  html += mItem(add(() => { S.sort[sh.id] = { col: col.id, dir: 1 }; closeFloat(); render(); }), sortA, { icon: 'up' });
  html += mItem(add(() => { S.sort[sh.id] = { col: col.id, dir: -1 }; closeFloat(); render(); }), sortD, { icon: 'down' });
  if (so && so.col === col.id) html += mItem(add(() => { S.sort[sh.id] = null; closeFloat(); render(); }), 'Clear sort', { icon: 'x' });

  if (col.slot) {

  }

  let values = [...counts.keys()];
  if (col.order) values = col.order.filter(v => counts.has(v)).concat(values.filter(v => !col.order.includes(v)));
  else if (values.every(v => v === '(Blanks)' || /^\d+$/.test(v))) values.sort((a, b) => (a === '(Blanks)') - (b === '(Blanks)') || +a - +b);

  html += `<div class="lg-mlist" data-slot="scroll-area">`;
  values.forEach(v => {

  });
  html += `</div></div>`;
  if (cur()) html += `<div class="lg-msep" role="separator"></div>` + mItem(add(() => { delete S.filters[sh.id][col.id]; closeFloat(); render(); }), `Clear filter from ${col.label}`, { icon: 'x' });
  function syncChecks() {
    floatEl.querySelectorAll('[data-v]').forEach(el => el.setAttribute('aria-checked', String(isOn(el.dataset.v))));
    floatEl.querySelector('[data-all]')?.setAttribute('aria-checked', allState());
  }
  openFloat(btn, html, { role: 'menu', label: `Sort and filter ${col.label}`, handlers: H });
  const si = floatEl.querySelector('.lg-msearch input');
  si?.addEventListener('input', () => { const q = si.value.trim().toLowerCase(); floatEl.querySelectorAll('[data-v]').forEach(el => { el.hidden = q && !el.dataset.v.toLowerCase().includes(q); }); });
}

  const page = Math.max(1, Math.floor(sheetEl.clientHeight / 33) - 3);
  let { r, c } = s;
  switch (e.key) {
    case 'ArrowUp': r = ctrl ? 0 : r - 1; break;
    case 'ArrowDown': r = ctrl ? R : r + 1; break;
    case 'ArrowLeft': c = ctrl ? 0 : c - 1; break;
    case 'ArrowRight': c = ctrl ? C : c + 1; break;
    case 'PageUp': r -= page; break;
    case 'PageDown': r += page; break;
    case 'Home': c = 0; if (ctrl) r = 0; break;
    case 'End': c = C; if (ctrl) r = R; break;
    case 'Enter': case ' ': e.preventDefault(); openPanel(targetAt(s.r, s.c), { focus: true }); return;
    case 'Escape': if (P.open) { closePanel(); } else { s.ar = s.r; s.ac = s.c; paintSel(); updateFormula(); updateStatus(); } e.preventDefault(); return;
    case 'a': if (ctrl) { e.preventDefault(); s.ar = 0; s.ac = 0; s.r = R; s.c = C; paintSel(); updateFormula(); updateStatus(); } return;
    default: return;
  }
  e.preventDefault();
  setSel(r, c, e.shiftKey);
});

/* pane keyboard */
paneEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.stopPropagation(); closePanel(); return; }
  const tr = e.target.closest('tr[data-open-key]');
  if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tr.click(); }
});

/* floating keyboard */
floatEl.addEventListener('keydown', e => {
  const items = Array.from(floatEl.querySelectorAll('[data-mi]')).filter(el => !el.hidden);
  const i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeFloat(); return; }
  if (e.key === 'Tab') { closeFloat(false); return; }
  if (!items.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[i <= 0 ? items.length - 1 : i - 1].focus(); }
  else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
  else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
});

/* tabs keyboard + global shortcuts */
document.getElementById('tabs').addEventListener('keydown', e => {
  const ids = TABS.map(t => t[0]), i = ids.indexOf(S.sheet);
  if (e.key === 'ArrowRight') { e.preventDefault(); switchSheet(ids[(i + 1) % ids.length], true); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); switchSheet(ids[(i - 1 + ids.length) % ids.length], true); }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing && !dlg.open) { e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'PageDown' || e.key === 'PageUp')) {
    e.preventDefault();
    const ids = TABS.map(t => t[0]), i = ids.indexOf(S.sheet);
    switchSheet(ids[(i + (e.key === 'PageDown' ? 1 : -1) + ids.length) % ids.length]);
    if (S.sheet !== 'quality' && V.rows.length) { const s = S.sel[S.sheet]; V.tds[s.r][s.c].focus({ preventScroll: true }); }
  }
  if (e.key === 'Escape' && P.open && !mqDock.matches && !dlg.open) closePanel();
});

/* breakpoints */
mqSmall.addEventListener('change', () => { if (S.sheet !== 'quality') refreshGrid(); });
mqDock.addEventListener('change', layoutPanel);

/* ================= boot ================= */
render();
if (matchMedia('(min-width: 1280px)').matches && V.rows.length) openPanel(targetAt(0, 0), { follow: true });
})();
</script>
