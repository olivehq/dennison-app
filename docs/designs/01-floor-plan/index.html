    if (t.hasAttribute('data-clear')) { state.q = ''; state.free = 0; document.getElementById('q').value = ''; return render(); }
    if (t.dataset.goBuyers) {
      state.free = +t.dataset.goBuyers; state.view = 'buyers'; state.q = ''; document.getElementById('q').value = '';
      if (state.sheet) closeSheet(); else render();
      return toast(`Showing buyers free in slot ${state.free}`);
    }
    if (t.hasAttribute('data-show-floor')) {
      if (state.sheet.kind === 'buyer') {
        const first = SLOTS.find(s => at(buyGrid, state.sheet.name, s.n));
        if (first && !at(buyGrid, state.sheet.name, state.slot)) state.slot = first.n;
      }
      state.view = 'floor'; const back = state.sheet; closeSheet(); state.sheet = null;
      const desk = back.kind === 'supplier' ? document.querySelector(`.desk[data-sup="${CSS.escape(back.name)}"]`)
        : [...document.querySelectorAll('.desk[data-appt]')].find(d => appts[+d.dataset.appt].buyer === back.name);
      if (desk) { desk.classList.add('is-target'); desk.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); desk.focus({ preventScroll: true }); }
      return;
    }
    if (t.hasAttribute('data-edit-this')) {
      state.editing = true; renderChrome();
      return toast('Edit mode on', 'Pick a slot to move or swap. Each change is added to the manual change count.');
    }
    if (t.dataset.dialogCancel != null) return closeDialog();
    if (t.dataset.dialogOk != null) { const fn = dialogConfirm; closeDialog(); return fn && fn(); }
    if (t.dataset.export) {
      document.getElementById('export-pop').classList.remove('open');
      document.getElementById('act-export').setAttribute('aria-expanded', 'false');
      return toast(`Preparing ${t.dataset.export.toLowerCase()}`, state.locked ? 'Built from the locked schedule.' : 'Built from the current draft. Lock the schedule before emailing anyone.');
    }
    if (t.dataset.sup) return openSheet('supplier', t.dataset.sup);
    if (t.dataset.buyer) return openSheet('buyer', t.dataset.buyer);
    switch (t.id) {
      case 'act-run':
        return openDialog({ title: 'Run matching again?', confirm: 'Run matching',
          body: `<p>This builds a new draft from the latest rankings and replaces the current one.</p><p>The ${plural(D.event.manualChanges, 'manual change')} made since the last run will be lost.</p>`,
          onConfirm: () => toast('Matching started', 'The new draft replaces this one when it finishes.') });
      case 'act-edit':
        state.editing = !state.editing; renderChrome();
        return toast(state.editing ? 'Edit mode on' : 'Edit mode off', state.editing ? 'Open any desk or buyer to move or swap an appointment.' : 'The draft is unchanged.');
      case 'act-lock':
        if (state.locked) { state.locked = false; render(); return toast('Schedule unlocked', 'Edits and matching are available again.'); }
        return openDialog({ title: 'Lock this schedule?', confirm: 'Lock schedule',
          body: `<p>Locking stops edits and re-runs, and lets you export and email final schedules.</p>${issueCount ? `<p class="text-foreground"><span class="delta mr-1.5 align-middle" aria-hidden="true"></span>${[STATS.below.length && plural(STATS.below.length, 'buyer') + ` below ${SET.buyerMin}`, STATS.above.length && plural(STATS.above.length, 'buyer') + ` above ${SET.buyerMax}`, STATS.supOff.length && plural(STATS.supOff.length, 'supplier') + ` not at ${SET.supplierTarget}`].filter(Boolean).join(', ')}. You can still lock.</p>` : '<p>Every count is on target.</p>'}`,
          onConfirm: () => { state.locked = true; state.editing = false; render(); if (state.sheet) renderSheet(); toast('Schedule locked', `${STATS.total} appointments are final.`); } });
      case 'act-export': {
        const pop = document.getElementById('export-pop'), open = !pop.classList.contains('open');
        pop.classList.toggle('open', open); t.setAttribute('aria-expanded', String(open));
        if (open) pop.querySelector('[role="menuitem"]').focus();
        return;
      }
      case 'open-cmd': return openCmd();
    }
  });

  document.addEventListener('click', e => {
    const pop = document.getElementById('export-pop');
    if (pop.classList.contains('open') && !e.target.closest('#export-pop, #act-export')) { pop.classList.remove('open'); document.getElementById('act-export').setAttribute('aria-expanded', 'false'); }
  });

  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; hideHover(); render(); });
  document.getElementById('free').addEventListener('change', e => {
    state.free = +e.target.value;
    if (state.free && state.view === 'floor') state.slot = state.free;
    render();
  });

  document.addEventListener('input', e => { if (e.target.id === 'cmd-q') { cmdSel = 0; renderCmd(); } });

  const trap = (el, e) => {
    const f = [...el.querySelectorAll('button:not(:disabled), input, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  };

  document.addEventListener('keydown', e => {
    const cmdOpen = document.getElementById('cmd').classList.contains('open');
    const dlgOpen = document.getElementById('dialog').classList.contains('open');
    const pop = document.getElementById('export-pop');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return cmdOpen ? closeCmd() : openCmd(); }
    if (e.key === 'Escape') {
      if (cmdOpen) return closeCmd();
      if (dlgOpen) return closeDialog();
      if (pop.classList.contains('open')) { pop.classList.remove('open'); document.getElementById('act-export').setAttribute('aria-expanded', 'false'); return document.getElementById('act-export').focus(); }
      if (state.sheet) return closeSheet();
      return hideHover();
    }
    if (cmdOpen) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = renderCmd().length; cmdSel = (cmdSel + (e.key === 'ArrowDown' ? 1 : -1) + n) % Math.max(n, 1); renderCmd(); }
      else if (e.key === 'Enter') { e.preventDefault(); pickCmd(cmdSel); }
      else if (e.key === 'Tab') e.preventDefault();
      return;
    }
    if (e.key === 'Tab') {
      if (dlgOpen) return trap(document.getElementById('dialog'), e);
      if (state.sheet) return trap(document.getElementById('sheet'), e);
    }
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('q').focus(); return; }
    const seg = e.target.closest?.('.scrub-seg');
    if (seg) {
      const i = SLOTS.findIndex(s => s.n === state.slot);
      const map = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: NS - 1 };
      if (e.key in map) { e.preventDefault(); const j = (map[e.key] + NS) % NS; setSlot(SLOTS[j].n, true); }
      return;
    }
    const tab = e.target.closest?.('[role="tab"]');
    if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault();
      const i = VIEWS.findIndex(v => v.id === state.view);
      setView(VIEWS[(i + (e.key === 'ArrowRight' ? 1 : -1) + VIEWS.length) % VIEWS.length].id, true);
    }
  });

  // hover card for appointments (desks and strip cells)
  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const t = e.target.closest('[data-appt]');
    if (!t || t.closest('#sheet')) return;
    clearTimeout(hcTimer); hcTimer = setTimeout(() => showHover(t), 220);
  });
  document.addEventListener('pointerout', e => {
    const from = e.target.closest('[data-appt]');
    if (from && from !== e.relatedTarget?.closest?.('[data-appt]')) hideHover();
  });
  document.addEventListener('focusin', e => { const t = e.target.closest?.('[data-appt]'); if (t && !t.closest('#sheet') && t.matches(':focus-visible')) showHover(t); else hideHover(); });
  window.addEventListener('scroll', hideHover, { passive: true });

  render();
})();
</script>
</body>
</html>
