<!--
  Design: 04, Command workspace

  Concept: A keyboard-first, three-pane workspace that treats the AW schedule like an inbox of 504 meetings:
  views and saved filters on the left, a dense list in the middle, and the selected person's afternoon on the right.
  Every number is computed live from AW_DATA, and Cmd/Ctrl-K jumps to any buyer, supplier, slot or action without touching the mouse.

  Palette (dark default, light toggle):
    Harbour slate ground  oklch(0.262 0.032 240)  #162733
    Pane slate            oklch(0.290 0.034 240)  #1b2e3b
    Sidebar slate         oklch(0.238 0.030 242)  #11212c
    Chalk (primary)       oklch(0.930 0.020 85)   #eee7d9
    Jade (mutual top 10)  oklch(0.800 0.150 160)  #52db9c
    Sky (hotel)           oklch(0.780 0.085 232)  #7ec1e5
    Rose (business)       oklch(0.760 0.120 350)  #ea91bc
    Amber (below target)  oklch(0.830 0.140 78)   #f9bb51
    Coral (destructive)   oklch(0.680 0.180 28)   #f36356
    Light mode ground     oklch(0.975 0.006 230)  #f3f8fa

  Type: Atkinson Hyperlegible Next for all interface text (built for legibility, tabular figures for ranks and desks);
  Sofia Sans Condensed for slot times, desk numbers and pane titles, so the clock reads at a glance in the schedule rail.

  Layout: header bar with event, status and admin actions; below it a collapsible Sidebar, then a Resizable pair of panels:
  the list (slots, buyers, suppliers or quality) and the detail pane with a nine-slot time rail. Under 1024px the detail
  pane becomes a Sheet; under 768px the sidebar becomes an off-canvas Sheet and list rows reflow via container queries.

  shadcn components mirrored (data-slot attributes in markup): Sidebar (+ SidebarGroup, SidebarMenu, SidebarMenuButton,
  SidebarMenuBadge, SidebarTrigger), Resizable (ResizablePanelGroup, ResizablePanel, ResizableHandle), Command inside Dialog
  (CommandInput, CommandList, CommandGroup, CommandItem, CommandShortcut, CommandEmpty), Kbd, Button, Badge, InputGroup,
  Select, ToggleGroup, ScrollArea, Separator, Sheet, Dialog / AlertDialog, Popover (DropdownMenu-style), Tooltip (title),
  Progress, Chart, Alert, Empty, Table (div grid with ARIA roles), sonner toast.
-->

  --mutual: oklch(0.80 0.15 160);

  --hotel: oklch(0.78 0.085 232);
  --hotel-soft: oklch(0.78 0.085 232 / 0.15);

@theme inline {
  --font-sans: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Sofia Sans Condensed", "Atkinson Hyperlegible Next", ui-sans-serif, sans-serif;
  --radius-sm: calc(var(--radius) - 4px);
  --radius-md: calc(var(--radius) - 2px);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) + 4px);
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-4: var(--chart-4);
  --color-chart-5: var(--chart-5);
  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-border: var(--sidebar-border);
  --color-mutual: var(--mutual);
  --color-mutual-soft: var(--mutual-soft);
  --color-hotel: var(--hotel);
  --color-hotel-soft: var(--hotel-soft);
  --color-business: var(--business);
  --color-business-soft: var(--business-soft);
  --color-warning: var(--warning);
  --color-warning-soft: var(--warning-soft);
  --color-warning-foreground: var(--warning-foreground);
}

@layer base {
  * { border-color: var(--color-border); }
  html, body { height: 100%; }
  body { font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }
  button { cursor: pointer; }
  mark { background: var(--color-warning-soft); color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px var(--color-warning-soft); }
  ::selection { background: color-mix(in oklch, var(--color-ring) 35%, transparent); }
}

@layer components {
  /* Button (cva variants) */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; height:2rem; padding:0 .75rem; border-radius:var(--radius-md); font-size:.8125rem; font-weight:600; white-space:nowrap; border:1px solid transparent; transition:background-color .12s, color .12s, border-color .12s; }
  .btn svg { width:1rem; height:1rem; flex:none; }
  .btn:disabled { opacity:.5; pointer-events:none; }
  .btn-default { background:var(--color-primary); color:var(--color-primary-foreground); }
  .btn-default:hover { background:color-mix(in oklch, var(--color-primary) 88%, var(--color-background)); }
  .btn-outline { border-color:var(--color-input); background:transparent; color:var(--color-foreground); }
  .btn-outline:hover, .btn-ghost:hover { background:var(--color-accent); color:var(--color-accent-foreground); }
  .btn-secondary { background:var(--color-secondary); color:var(--color-secondary-foreground); }
  .btn-secondary:hover { background:var(--color-accent); }
  .btn-ghost { background:transparent; color:inherit; }
  .btn-destructive { background:var(--color-destructive); color:var(--color-destructive-foreground); }
  .btn-sm { height:1.75rem; padding:0 .55rem; font-size:.75rem; }
  .btn-icon { width:2rem; padding:0; }
  .btn-sm.btn-icon { width:1.75rem; }

  /* Kbd */
  .kbd { display:inline-flex; align-items:center; justify-content:center; min-width:1.25rem; height:1.25rem; padding:0 .3rem; border-radius:var(--radius-sm); font:600 .6875rem/1 var(--font-sans); background:var(--color-muted); color:var(--color-muted-foreground); border:1px solid var(--color-border); box-shadow:inset 0 -1px 0 var(--color-border); }
  .kbd-group { display:inline-flex; gap:.2rem; align-items:center; }

  /* Badge */
  .badge { display:inline-flex; align-items:center; gap:.3rem; height:1.25rem; padding:0 .45rem; border-radius:var(--radius-sm); font-size:.6875rem; font-weight:600; white-space:nowrap; border:1px solid transparent; }
  .badge svg { width:.8rem; height:.8rem; flex:none; }
  .badge-outline { border-color:var(--color-border); color:var(--color-muted-foreground); }
  .badge-secondary { background:var(--color-secondary); color:var(--color-secondary-foreground); }
  .badge-hotel { background:var(--color-hotel-soft); color:var(--color-hotel); }
  .badge-business { background:var(--color-business-soft); color:var(--color-business); }
  .badge-mutual { background:var(--color-mutual-soft); color:var(--color-mutual); }
  .badge-warning { background:var(--color-warning-soft); color:var(--color-warning); }
  .badge-destructive { background:color-mix(in oklch, var(--color-destructive) 16%, transparent); color:var(--color-destructive); }
  .badge-open { border:1px dashed var(--color-input); color:var(--color-muted-foreground); }

  /* Sidebar menu button */
  .sb-btn { display:flex; align-items:center; gap:.6rem; width:100%; height:2rem; padding:0 .55rem; border-radius:var(--radius-md); font-size:.8125rem; font-weight:500; color:var(--color-sidebar-foreground); text-align:left; }
  .sb-btn svg { width:1rem; height:1rem; flex:none; opacity:.8; }
  .sb-btn:hover { background:var(--color-sidebar-accent); }
  .sb-btn[data-active="true"] { background:var(--color-sidebar-accent); font-weight:700; }
  .sb-btn[data-active="true"] svg { opacity:1; }
  .sb-count { margin-left:auto; font-size:.6875rem; font-weight:600; color:var(--color-muted-foreground); font-variant-numeric:tabular-nums; }
  .sb-count[data-tone="warning"] { color:var(--color-warning); }

  /* List rows */
  .row { display:grid; width:100%; text-align:left; align-items:center; column-gap:.75rem; padding:.45rem .9rem; border-bottom:1px solid color-mix(in oklch, var(--color-border) 55%, transparent); position:relative; font-size:.8125rem; }
  .row:hover { background:color-mix(in oklch, var(--color-accent) 50%, transparent); }
  .row[data-active="true"] { background:var(--color-accent); }
  .row[data-active="true"]::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--color-ring); }
  .row:focus-visible { outline:2px solid var(--color-ring); outline-offset:-2px; }
  .row { scroll-margin-top:5.5rem; scroll-margin-bottom:.5rem; }

  .row-appt { grid-template-columns: 2.6rem 2.2rem minmax(0,1fr) minmax(0,1.25fr) 1rem 3.1rem 3.1rem; }
  .cols-appt { display:grid; grid-template-columns: 2.6rem 2.2rem minmax(0,1fr) minmax(0,1.25fr) 1rem 3.1rem 3.1rem; column-gap:.75rem; padding:0 .9rem; }
  .row-buyer { grid-template-columns: minmax(0,1fr) auto 3.25rem; padding-block:.55rem; }
  .row-supplier { grid-template-columns: 2.2rem minmax(0,1fr) auto 3.25rem; padding-block:.55rem; }

  .num { font-family:var(--font-display); font-weight:600; font-variant-numeric:tabular-nums; }
  .rank { display:inline-flex; align-items:center; justify-content:center; gap:.25rem; min-width:2.4rem; height:1.35rem; border-radius:var(--radius-sm); font-weight:600; font-variant-numeric:tabular-nums; color:var(--color-foreground); justify-self:center; }
  .rank[data-blank="true"] { color:var(--color-muted-foreground); }
  .rank[data-top="true"] { color:var(--color-mutual); }
  .row[data-mutual="true"] .rank { background:var(--color-mutual-soft); color:var(--color-mutual); }
  .rank-l { display:none; font-size:.625rem; font-weight:600; color:var(--color-muted-foreground); }
  .mutual-mark { color:var(--color-mutual); display:inline-flex; }
  .mutual-mark svg { width:1rem; height:1rem; }

  .type-ico { display:inline-flex; width:1.1rem; height:1.1rem; align-items:center; justify-content:center; border-radius:4px; flex:none; }
  .type-ico svg { width:.75rem; height:.75rem; }
  .type-ico[data-type="hotel"] { background:var(--color-hotel-soft); color:var(--color-hotel); }
  .type-ico[data-type="business"] { background:var(--color-business-soft); color:var(--color-business); }

  /* Nine-slot strip used in list rows */
  .strip { display:inline-grid; grid-template-columns:repeat(9, .55rem); gap:2px; }
  .strip i { height:.95rem; border-radius:2px; background:color-mix(in oklch, var(--color-muted-foreground) 55%, transparent); }
  .strip i[data-s="m"] { background:var(--color-mutual); }
  .strip i[data-s="o"] { background:transparent; box-shadow: inset 0 0 0 1px var(--color-input); }
  .strip i[data-hl="true"] { outline:2px solid var(--color-warning); outline-offset:1px; }

  .group-head { position:sticky; top:2.25rem; z-index:2; display:flex; align-items:center; gap:.75rem; padding:.5rem .9rem; background:color-mix(in oklch, var(--color-background) 92%, var(--color-foreground)); border-bottom:1px solid var(--color-border); }

  /* Detail time rail */
  .rail-row { display:grid; grid-template-columns: 3.9rem 1.1rem minmax(0,1fr); column-gap:.7rem; position:relative; }
  .rail-time { padding-top:.55rem; text-align:right; }
  .rail-time b { display:block; font-family:var(--font-display); font-size:1.7rem; line-height:1; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .rail-time span { display:block; font-size:.6875rem; color:var(--color-muted-foreground); margin-top:.15rem; }
  .rail-node { position:relative; }
  .rail-node::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%); background:var(--color-border); }
  .rail-row:first-child .rail-node::before { top:1.05rem; }
  .rail-row:last-child .rail-node::before { bottom:auto; height:1.05rem; }
  .rail-node i { position:absolute; left:50%; top:.8rem; width:.7rem; height:.7rem; transform:translateX(-50%); border-radius:999px; background:var(--color-muted-foreground); box-shadow:0 0 0 3px var(--color-background); }
  .rail-row[data-state="mutual"] .rail-node i { background:var(--color-mutual); }
  .rail-row[data-state="open"] .rail-node i { background:var(--color-background); border:2px dashed var(--color-warning); }
  .rail-body { margin:.3rem 0; padding:.55rem .7rem; border-radius:var(--radius-lg); border:1px solid transparent; min-width:0; }
  .rail-row[data-state="booked"] .rail-body, .rail-row[data-state="mutual"] .rail-body { background:var(--color-card); border-color:var(--color-border); }
  .rail-row[data-state="mutual"] .rail-body { box-shadow: inset 3px 0 0 var(--color-mutual); }
  .rail-row[data-state="open"] .rail-body { border:1px dashed color-mix(in oklch, var(--color-warning) 60%, transparent); background:var(--color-warning-soft); }
  .rail-row[data-focus="true"] .rail-body { outline:2px solid var(--color-ring); outline-offset:1px; }

  /* Toggle group */
  .tg { display:inline-flex; border:1px solid var(--color-input); border-radius:var(--radius-md); padding:2px; gap:2px; }
  .tg button { height:1.5rem; padding:0 .55rem; border-radius:calc(var(--radius-md) - 2px); font-size:.75rem; font-weight:600; color:var(--color-muted-foreground); }
  .tg button:hover { color:var(--color-foreground); }
  .tg button[aria-pressed="true"] { background:var(--color-secondary); color:var(--color-foreground); }

  /* Command items */
  .cmd-item { display:flex; align-items:center; gap:.65rem; padding:.45rem .6rem; border-radius:var(--radius-md); font-size:.8125rem; cursor:pointer; }
  .cmd-item svg { width:1rem; height:1rem; flex:none; color:var(--color-muted-foreground); }
  .cmd-item[aria-selected="true"] { background:var(--color-accent); color:var(--color-accent-foreground); }
  .cmd-heading { padding:.55rem .6rem .25rem; font-size:.6875rem; font-weight:700; color:var(--color-muted-foreground); }

  .menu-item { display:flex; width:100%; align-items:center; gap:.6rem; padding:.45rem .6rem; border-radius:var(--radius-md); font-size:.8125rem; text-align:left; }
  .menu-item svg { width:1rem; height:1rem; flex:none; color:var(--color-muted-foreground); }
  .menu-item:hover, .menu-item:focus-visible { background:var(--color-accent); outline:none; }
}

/* Layout: sidebar provider + resizable panel group */
#workspace { display:grid; grid-template-columns: var(--sb-w, 15rem) minmax(0,1fr); min-height:0; }
#workspace[data-collapsed="true"] { --sb-w: 3.25rem; }
#workspace[data-collapsed="true"] .sb-label, #workspace[data-collapsed="true"] .sb-count, #workspace[data-collapsed="true"] .sb-hide { display:none; }
#workspace[data-collapsed="true"] .sb-btn { justify-content:center; padding:0; }
#panels { display:grid; grid-template-columns: minmax(0,1fr) 9px var(--detail-w, 27rem); min-height:0; min-width:0; }
#listPane { container-type: inline-size; min-width:0; min-height:0; }
#handle { cursor:col-resize; touch-action:none; position:relative; }
#handle::before { content:""; position:absolute; inset:0 4px; background:var(--color-border); }
#handle:hover::before, #handle[data-dragging="true"]::before { background:var(--color-ring); inset:0 3px; }
#handle span { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:.8rem; height:1.6rem; border-radius:4px; background:var(--color-border); display:grid; place-items:center; color:var(--color-muted-foreground); }
#detailPane { min-height:0; min-width:0; }
.overlay { position:fixed; inset:0; background:oklch(0.15 0.03 240 / .55); z-index:40; }
.sheet-only { display:none; }

@media (max-width: 1023px) {
  #panels { grid-template-columns: minmax(0,1fr); }
  #handle { display:none; }
  #detailPane { position:fixed; inset:0 0 0 auto; width:min(30rem, 100vw); z-index:50; transform:translateX(100%); transition:transform .22s ease; box-shadow: -12px 0 32px oklch(0.1 0.03 240 / .35); visibility:hidden; }
  #detailPane[data-state="open"] { transform:none; visibility:visible; }
  .sheet-only { display:inline-flex; }
}
@media (max-width: 767px) {
  #workspace, #workspace[data-collapsed="true"] { grid-template-columns: minmax(0,1fr); --sb-w: 17rem; }
  #workspace[data-collapsed="true"] .sb-label, #workspace[data-collapsed="true"] .sb-count, #workspace[data-collapsed="true"] .sb-hide { display:revert; }
  #workspace[data-collapsed="true"] .sb-btn { justify-content:flex-start; padding:0 .55rem; }
  #sidebar { position:fixed; inset:0 auto 0 0; width:17rem; z-index:50; transform:translateX(-100%); transition:transform .22s ease; visibility:hidden; }
  #sidebar[data-mobile-open="true"] { transform:none; visibility:visible; }
}

/* Narrow list pane: rows reflow (phones, or a squeezed panel) */
@container (max-width: 560px) {
  .cols-appt { display:none; }
  .group-head { top:0; }
  .row { scroll-margin-top:3.5rem; }
  .row-appt { grid-template-columns: 2.5rem minmax(0,1fr) auto; grid-template-areas: "time sup ranks" "time buy ranks"; row-gap:.15rem; padding-block:.55rem; }
  .row-appt .c-time { grid-area:time; align-self:start; }
  .row-appt .c-desk { display:none; }
  .row-appt .c-sup { grid-area:sup; }
  .row-appt .c-buy { grid-area:buy; }
  .row-appt .c-ranks { grid-area:ranks; display:flex; gap:.3rem; align-items:center; }
  .row-appt .rank { flex-direction:column; height:auto; padding:.15rem .3rem; gap:0; min-width:2.2rem; }
  .row-appt .rank-l { display:block; }
  .row-appt .c-desk-inline { display:inline; }
  .row-buyer { grid-template-columns: minmax(0,1fr) 3rem; }
  .row-buyer .strip-cell { grid-column: 1 / -1; order:3; margin-top:.35rem; }
  .row-supplier { grid-template-columns: 2rem minmax(0,1fr) 3rem; }
  .row-supplier .strip-cell { grid-column: 2 / -1; order:3; margin-top:.35rem; }
  .group-head { flex-wrap:wrap; }
}
@container (min-width: 561px) {
  .c-ranks { display:contents; }
  .c-desk-inline { display:none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; }
}
.fade-in { animation: fadeIn .16s ease-out; }
@keyframes fadeIn { from { opacity:0; transform: translateY(3px);} to { opacity:1; transform:none; } }
