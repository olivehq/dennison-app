      return;
    }
    render();
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) {
      if (!e.target.closest("#export-menu") && !e.target.closest("#act-export")) toggleExport(false);
      return;
    }
    const { act, kind, id } = el.dataset;
    if (act === "open") {
      if (stack.some((o) => o.root.id === "phone-root")) closeOverlay($("#phone-root"));
      openSheet(kind, id, el.dataset.n ? +el.dataset.n : undefined);
    } else if (act === "person") {
      state.sel[kind] = id;
      if (state.preview) {
        if (wide.matches) { document.querySelectorAll(".dcard.is-selected").forEach((c) => c.classList.remove("is-selected")); el.closest(".dcard").classList.add("is-selected"); renderPhone($("#phone-dock")); }
        else setPreview(true);
      } else openSheet(kind, id);
    } else if (act === "person-sheet") {
      if (stack.some((o) => o.root.id === "phone-root")) closeOverlay($("#phone-root"));
      openSheet(kind, id);
    } else if (act === "preview-person") {
      closeOverlay($("#sheet-root"));
      setPreview(true, kind, id);
    } else if (act === "slot") {
      state.slot = +el.dataset.n; state.free = 0; render();
      $(`[data-act="slot"][data-n="${state.slot}"]`)?.focus();
    } else if (act === "clear") {
      state.q = ""; state.show = "all"; state.free = 0; $("#q").value = ""; render();
    } else if (act === "email-one") {
      toast(state.locked ? `Card emailed to ${id}` : "Lock the schedule before emailing", state.locked ? "" : "Participants only get a schedule once it's locked.");
    } else if (act === "edit-person") {
      toast("Editing this card", "In the app, choose a line to move or swap it.");
    }
  });

  $("#tabs").addEventListener("click", (e) => {
    const t = e.target.closest("[data-view]");
    if (!t || t.dataset.view === state.view) return;
    state.view = t.dataset.view; render(); $(`#tab-${state.view}`).focus();
  });
  $("#tabs").addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    e.preventDefault();
    const ids = VIEWS.map((v) => v.id);
    let i = ids.indexOf(state.view);
    i = e.key === "Home" ? 0 : e.key === "End" ? ids.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + ids.length) % ids.length;
    state.view = ids[i]; render(); $(`#tab-${state.view}`).focus();
  });

  let qTimer;
  $("#q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#show").addEventListener("change", (e) => { state.show = e.target.value; render(); });
  $("#free").addEventListener("change", (e) => { state.free = +e.target.value; if (state.free) state.slot = state.free; render(); });
  $("#preview-toggle").addEventListener("click", () => setPreview(!state.preview));
  $("#open-cmd").addEventListener("click", openCmd);

  $("#act-run").addEventListener("click", () => confirmDialog({
    title: "Run matching again?",
    body: `<p>This rebuilds all ${D.appointments.length} appointments from the latest rankings.</p><p class="font-semibold text-destructive">The ${plural(D.event.manualChanges, "manual change")} made since the last run will be replaced.</p>`,
    confirm: "Run matching", variant: "destructive",
    onConfirm: () => toast("Matching started", "The wall updates when the new schedule is ready."),
  }));
  $("#act-edit").addEventListener("click", () => {
    state.editing = !state.editing; renderHeader();
    toast(state.editing ? "Editing on" : "Editing off", state.editing ? "Open any card to move, add or swap a meeting." : "");
  });
  $("#act-lock").addEventListener("click", () => {
    if (state.locked) { state.locked = false; state.editing = false; render(); toast("Schedule unlocked", "Changes are allowed again."); return; }
    const fb = flagged(buyers), fs = flagged(suppliers);
    const issues = [
      fb.length ? `<li>${plural(fb.length, "buyer")} outside ${SET.buyerMin} to ${SET.buyerMax}: ${fb.map((p) => esc(p.title)).join(", ")}.</li>` : "",
      fs.length ? `<li>${plural(fs.length, "supplier")} not at ${SET.supplierTarget}.</li>` : "",
    ].join("");
    confirmDialog({
      title: "Lock this schedule?",
      body: `${issues ? `<div class="rounded-md bg-attention-soft p-3 text-foreground" data-slot="alert"><p class="font-semibold">Still flagged</p><ul class="mt-1 list-disc pl-5">${issues}</ul></div>` : `<p>Nothing is flagged.</p>`}<p>Locking freezes all ${D.appointments.length} appointments so they can be exported and emailed. You can unlock later.</p>`,
      confirm: issues ? "Lock anyway" : "Lock schedule",
      onConfirm: () => { state.locked = true; state.editing = false; render(); toast("Schedule locked", `${D.appointments.length} appointments frozen. Export and email are ready.`); },
    });
  });
  $("#act-export").addEventListener("click", (e) => { e.stopPropagation(); toggleExport(); });
  $("#export-menu").addEventListener("click", (e) => {
    const b = e.target.closest("[data-export]");
    if (!b || b.disabled) return;
    toggleExport(false); $("#act-export").focus();
    const t = b.dataset.export;
    if (t === "xlsx") toast("Exported Excel workbook", `${D.appointments.length} appointments, ${NS} slots.`);
    if (t === "pdf") toast("Exported dance cards", `${buyers.length + suppliers.length} cards in one PDF.`);
    if (t === "email") toast("Emails queued", `${buyers.length + suppliers.length} participants will get their schedule.`);
  });

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); return; }
    if (e.key === "Escape") {
      if (!$("#export-menu").hidden) { toggleExport(false); $("#act-export").focus(); return; }
      if (stack.length) { closeOverlay(); return; }
    }
    if (e.key === "/" && !stack.length && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
    if (e.key === "Tab" && stack.length) {
      const root = stack[stack.length - 1].root;
      const f = [...root.querySelectorAll(FOCUSABLE)].filter((x) => x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
    if (!$("#export-menu").hidden && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      const items = [...$("#export-menu").querySelectorAll(".menu-item:not(:disabled)")];
      const i = items.indexOf(document.activeElement);
      e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus();
    }
  });
  wide.addEventListener("change", () => { if (state.preview) { if (wide.matches) closeOverlay($("#phone-root")); render(); } });

  render();
})();
</script>
</body>
</html>
