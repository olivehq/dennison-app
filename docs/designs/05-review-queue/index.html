        <span class="num text-[14px] text-muted-foreground pt-0.5">${s.start}</span>
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
            <button class="font-semibold text-left hover:underline underline-offset-4" data-action="${isB ? 'open-supplier' : 'open-buyer'}" data-name="${attr(isB ? a.supplier : a.buyer)}" data-push="1">${esc(isB ? a.supplier : (other?.organization || a.buyer))}</button>
            ${isB ? typeBadge(a.type) : ''}${isMutual(a) ? mutualBadge() : ''}
          </div>
          ${!isB && other ? `<p class="text-[13.5px] text-muted-foreground">${esc(other.title)}</p>` : ''}
          <p class="text-[13.5px] text-muted-foreground mt-0.5 num">Desk ${a.desk}. Buyer’s rank ${rank(a.buyerRank, { weak: isWeak(a) })}, supplier’s rank ${rank(a.supplierRank)}.</p>
        </div></li>`;
    }).join('')}</ol>`;
  }

  /* ---------- Command palette (cmd-K) ---------- */
  let cmdIndex = 0;
  function openCommand() {
    const root = document.getElementById('dialog-root');
    root.innerHTML = `<div class="overlay z-40" data-action="close-dialog"></div>
      <div data-slot="dialog-content" class="z-50 overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="cmd-title">
        <h2 id="cmd-title" class="sr-only">Quick find</h2>
        <div data-slot="command">
          <label data-slot="command-input-wrapper" class="flex items-center gap-2 px-4 h-12 border-b border-border">
            ${icon('chevDown', 'hidden')}<svg class="size-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input data-slot="command-input" id="cmd-input" class="flex-1 bg-transparent outline-0 text-[15px]" placeholder="Find a buyer, organization or supplier" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="cmd-list">
          </label>
          <div data-slot="command-list" id="cmd-list" role="listbox" class="max-h-[60vh] overflow-y-auto p-1.5"></div>
        </div>
      </div>`;
    const input = document.getElementById('cmd-input');
    input.addEventListener('input', () => { cmdIndex = 0; renderCommandList(input.value); });
    input.addEventListener('keydown', e => {
      const items = [...document.querySelectorAll('[data-slot="command-item"]')];
      if (e.key === 'ArrowDown') { e.preventDefault(); cmdIndex = Math.min(items.length - 1, cmdIndex + 1); markCmd(items); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cmdIndex = Math.max(0, cmdIndex - 1); markCmd(items); }
      else if (e.key === 'Enter' && items[cmdIndex]) { e.preventDefault(); items[cmdIndex].click(); }
    });
    cmdIndex = 0;
    renderCommandList('');
    input.focus();
  }
  function markCmd(items) {
    items.forEach((el, i) => el.setAttribute('aria-selected', i === cmdIndex));
    items[cmdIndex]?.scrollIntoView({ block: 'nearest' });
  }
  function renderCommandList(q) {
    const nq = norm(q.trim());
    const bs = BUYERS.filter(b => !nq || norm(b.name).includes(nq)).slice(0, 7);
    const ss = SUPPLIERS.filter(s => !nq || norm(s.name).includes(nq)).slice(0, 7);
    const vs = VIEWS.filter(v => !nq || norm(v.label).includes(nq));
    const item = (action, attrs, main, side = '') => `<div data-slot="command-item" role="option" aria-selected="false" data-action="${action}" ${attrs} class="flex items-center justify-between gap-3 px-2.5 py-2 rounded-md cursor-pointer"><span class="min-w-0 truncate">${main}</span>${side}</div>`;
    const group = (label, html) => html ? `<div data-slot="command-group" role="group" aria-label="${label}"><p class="px-2.5 pt-2 pb-1 text-[12.5px] font-semibold text-muted-foreground">${label}</p>${html}</div>` : '';
    const html = group('Views', vs.map(v => item('view', `data-view="${v.id}" data-close="1"`, v.label)).join(''))
      + group('Buyers', bs.map(b => item('open-buyer', `data-name="${attr(b.name)}" data-close="1"`, `<span class="font-semibold">${esc(b.organization)}</span> <span class="text-muted-foreground text-[13.5px]">${esc(b.title)}</span>`, countBadge(b.count, buyerFlag(b), buyerFlag(b) === 'above' ? S.buyerMax : S.buyerMin))).join(''))
      + group('Suppliers', ss.map(s => item('open-supplier', `data-name="${attr(s.name)}" data-close="1"`, `<span class="text-muted-foreground num mr-1">Desk ${s.desk}</span> <span class="font-semibold">${esc(s.name)}</span>`, typeBadge(s.type))).join(''));
    document.getElementById('cmd-list').innerHTML = html || `<div data-slot="command-empty" class="px-3 py-8 text-center text-muted-foreground">No buyer or supplier matches “${esc(q)}”.</div>`;
    markCmd([...document.querySelectorAll('[data-slot="command-item"]')]);
  }
  function closeDialog() {
    document.getElementById('dialog-root').innerHTML = '';
    if (lastTrigger && document.contains(lastTrigger)) lastTrigger.focus();
  }

  /* ---------- Dialogs ---------- */
  function confirmDialog({ title, body, confirm, variant = 'default', onConfirm }) {
    const root = document.getElementById('dialog-root');
    root.innerHTML = `<div class="overlay z-40" data-action="close-dialog"></div>
      <div data-slot="dialog-content" class="z-50 p-6" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
        <h2 id="dlg-title" data-slot="dialog-title" class="text-[19px] font-bold leading-snug">${title}</h2>
        <div id="dlg-desc" data-slot="dialog-description" class="mt-2 text-muted-foreground">${body}</div>
        <div data-slot="dialog-footer" class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
          <button data-slot="button" data-variant="outline" data-action="close-dialog" id="dlg-cancel">Keep reviewing</button>
          <button data-slot="button" data-variant="${variant}" id="dlg-ok">${confirm}</button>
        </div>
      </div>`;
    document.getElementById('dlg-ok').addEventListener('click', () => { closeDialog(); onConfirm(); });
    document.getElementById('dlg-cancel').focus();
  }

  /* ---------- Popover (export) ---------- */
  function openExport(btn) {
    const root = document.getElementById('popover-root');
    if (root.innerHTML) { closePopover(); return; }
    const r = btn.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - 256, r.left + window.scrollX));
    btn.setAttribute('aria-expanded', 'true');
    const opts = [
      ['xlsx', 'file', 'Excel workbook', 'All sheets: by slot, buyer, supplier'],
      ['pdf', 'file', 'Printable schedules', 'One page per buyer and supplier'],
      ['email', 'mail', 'Email schedules', 'Send each person their day'],
    ];
    root.innerHTML = `<div data-slot="popover-content" role="menu" aria-label="Export" class="z-50" style="top:${r.bottom + window.scrollY + 6}px;left:${left}px">
      ${opts.map(([k, ic, l, d]) => `<button role="menuitem" data-action="export-pick" data-k="${k}" class="w-full flex items-start gap-3 text-left px-2.5 py-2 rounded-md hover:bg-accent focus-visible:bg-accent">
        ${icon(ic, 'size-4 mt-1 text-muted-foreground')}<span><span class="block font-semibold text-[14.5px]">${l}</span><span class="block text-[13px] text-muted-foreground">${d}</span></span></button>`).join('')}
    </div>`;
    root.querySelector('[role="menuitem"]').focus();
  }
  function closePopover() {
    document.getElementById('popover-root').innerHTML = '';
    document.getElementById('export-btn').setAttribute('aria-expanded', 'false');
  }

  /* ---------- Toast (sonner) ---------- */
  function toast(title, desc = '') {
    const t = document.createElement('li');
    t.setAttribute('data-slot', 'sonner-toast');
    t.className = 'rounded-lg border border-border bg-popover px-4 py-3 shadow-[0_10px_28px_oklch(0.26_0.03_250/.14)]';
    t.innerHTML = `<p class="font-bold text-[14.5px]">${esc(title)}</p>${desc ? `<p class="text-[13.5px] text-muted-foreground mt-0.5">${esc(desc)}</p>` : ''}`;
    const box = document.getElementById('toaster');
    box.appendChild(t);
    while (box.children.length > 3) box.firstElementChild.remove();
    setTimeout(() => t.remove(), 4800);
  }

  /* ---------- Tooltip for slot strips ---------- */
  const tip = document.getElementById('tooltip-root');
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[title]');
    if (!el) return;
    el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title');
  });
  document.addEventListener('mousemove', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) { tip.innerHTML = ''; return; }
    tip.innerHTML = `<div data-slot="tooltip-content" class="z-[70]" style="left:${Math.min(e.clientX + 12, window.innerWidth - 300)}px;top:${e.clientY + 16}px">${esc(el.dataset.tip)}</div>`;
  });

  /* ---------- Render ---------- */
  const VIEW_RENDER = { review: renderReview, slots: renderSlots, buyers: renderBuyers, suppliers: renderSuppliers };
  function render() {
    const fk = document.activeElement?.dataset?.fk;
    renderHeader();
    renderNav();
    main.innerHTML = VIEW_RENDER[state.view]();
    if (fk) document.querySelector(`[data-fk="${fk}"]`)?.focus();
    if (state.sheet) renderSheet();
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) { if (!e.target.closest('[data-slot="popover-content"]') && !e.target.closest('#export-btn')) closePopover(); return; }
    const act = el.dataset.action;
    if (act !== 'export') closePopover();
    if (el.dataset.close) closeDialog();
    switch (act) {
      case 'view': setView(el.dataset.view); break;
      case 'toggle': {
        const id = el.dataset.id;
        state.open.has(id) ? state.open.delete(id) : state.open.add(id);
        render(); document.querySelector(`[data-action="toggle"][data-id="${id}"]`)?.focus(); break;
      }
      case 'pick': state.pick[el.dataset.name] = Number(el.dataset.n); render(); refocus(`[data-action="pick"][data-name="${CSS.escape(el.dataset.name)}"][data-n="${el.dataset.n}"]`); break;
      case 'show-all': {
        const k = el.dataset.key;
        state.showAll.has(k) ? state.showAll.delete(k) : state.showAll.add(k);
        render(); refocus(`[data-action="show-all"][data-key="${CSS.escape(k)}"]`); break;
      }
      case 'slot': state.slot = Number(el.dataset.n); render(); break;
      case 'scope': state.buyerScope = el.dataset.v; render(); break;
      case 'stype': state.supplierType = el.dataset.v; render(); break;
      case 'reset-filters': state.freeSlot = 0; state.buyerScope = 'all'; state.supplierType = 'all'; setSearch(''); break;
      case 'clear-search': setSearch(''); document.getElementById('search').focus(); break;
      case 'go-queue': state.open.add('buyers'); setView('review'); document.getElementById('check-buyers')?.scrollIntoView({ block: 'start' }); break;
      case 'open-buyer':
      case 'open-supplier': {
        e.stopPropagation();
        const kind = act === 'open-buyer' ? 'buyer' : 'supplier';
        const inSheet = !!el.closest('[data-slot="sheet-content"]');
        openSheet({ kind, name: el.dataset.name, back: inSheet && state.sheet ? { ...state.sheet } : null }, inSheet ? null : el);
        break;
      }
      case 'open-appt': openSheet({ kind: 'appt', id: Number(el.dataset.id), tab: 'buyer' }, el); break;
      case 'sheet-tab': state.sheet.tab = el.dataset.v; renderSheet(); refocus(`[data-action="sheet-tab"][data-v="${el.dataset.v}"]`); break;
      case 'sheet-back': state.sheet = state.sheet.back; renderSheet(); document.querySelector('#sheet-root [data-autofocus]')?.focus(); break;
      case 'close-sheet': closeSheet(); break;
      case 'close-dialog': closeDialog(); break;
      case 'command': lastTrigger = el; openCommand(); break;
      case 'draft': {
        const d = { buyer: el.dataset.buyer, slot: Number(el.dataset.slotN), supplier: el.dataset.supplier, from: el.dataset.from || null };
        state.drafted.push(d);
        const b = buyers.get(d.buyer), from = d.from ? buyers.get(d.from) : null;
        toast('Swap drafted', `${d.supplier} at ${slotLabel(d.slot)} moves ${from ? `from ${from.organization} ` : ''}to ${b.organization}. It applies when you save in Edit schedule.`);
        render(); break;
      }
      case 'run':
        lastTrigger = el;
        confirmDialog({
          title: 'Run matching again?',
          body: `<p>This builds a new draft from the current rankings. The ${plural(D.event.manualChanges, 'manual change')} on this draft${state.drafted.length ? ` and ${plural(state.drafted.length, 'drafted swap')}` : ''} will be replaced.</p>`,
          confirm: 'Run matching', onConfirm: () => toast('Matching started', 'The new draft will replace this one when it finishes, in about a minute.'),
        }); break;
      case 'edit':
        if (state.locked) { toast('The schedule is locked', 'Unlock it before editing.'); break; }
        toast('Edit schedule', state.drafted.length ? `${plural(state.drafted.length, 'drafted swap')} ready to review and save.` : 'In the full app this opens the slot grid. Draft swaps from the buyer queue to start.'); break;
      case 'lock': {
        lastTrigger = el;
        if (state.locked) { state.locked = false; render(); toast('Schedule unlocked', 'You can edit it again.'); break; }
        const open = checks().filter(c => c.status !== 'pass');
        const att = open.filter(c => c.status === 'attention');
        confirmDialog({
          title: att.length ? `Lock with ${words(att.length)} ${att.length === 1 ? 'check' : 'checks'} still failing?` : 'Lock the schedule?',
          body: (open.length ? `<ul class="flex flex-col gap-2 mb-3">${open.map(c => `<li class="flex gap-2 items-start"><span class="shrink-0 scale-75 -mt-0.5">${VERDICT[c.status].svg}</span><span><span class="font-semibold text-foreground">${esc(c.title)}.</span> ${c.line}</span></li>`).join('')}</ul>` : '')
            + '<p>Locking freezes the schedule so it can be exported and emailed. You can unlock it later.</p>',
          confirm: att.length ? 'Lock anyway' : 'Lock schedule', variant: att.length ? 'destructive' : 'default',
          onConfirm: () => { state.locked = true; render(); toast('Schedule locked', 'Export is ready. Nothing changes until you unlock.'); },
        }); break;
      }
      case 'export': openExport(el); break;
      case 'export-pick': {
        closePopover();
        const k = el.dataset.k;
        if (k === 'email' && !state.locked) toast('Lock the schedule first', 'Emails go out from a locked schedule so nobody gets a draft.');
        else toast(k === 'xlsx' ? 'Exporting Excel workbook' : k === 'pdf' ? 'Preparing printable schedules' : 'Emails queued', k === 'email' ? `${BUYERS.length + SUPPLIERS.length} schedules will be sent.` : `${stats.total} appointments${state.locked ? '' : ', marked as draft'}.`);
        break;
      }
    }
  });
  const refocus = sel => { const n = document.querySelector(sel); if (n) n.focus(); };

  document.addEventListener('change', e => {
    if (e.target.dataset.actionChange === 'free-slot') { state.freeSlot = Number(e.target.value); render(); }
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); lastTrigger = document.activeElement; openCommand(); return; }
    if (e.key === '/' && !/input|select|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('search').focus(); return; }
    if (e.key === 'Escape') {
      if (document.getElementById('popover-root').innerHTML) { closePopover(); document.getElementById('export-btn').focus(); }
      else if (document.getElementById('dialog-root').innerHTML) closeDialog();
      else if (state.sheet) closeSheet();
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-action]')) { e.preventDefault(); e.target.click(); }
    // Keep focus inside an open sheet or dialog.
    if (e.key === 'Tab') {
      const scope = document.querySelector('#dialog-root [role="dialog"], #dialog-root [role="alertdialog"]') || document.querySelector('#sheet-root [role="dialog"]');
      if (!scope) return;
      const f = [...scope.querySelectorAll('button, [href], input, select, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  const search = document.getElementById('search');
  let st;
  search.addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => { state.q = norm(search.value.trim()); render(); }, 120); });
  function setSearch(v) { search.value = v; state.q = norm(v); render(); }

  function setView(v) {
    if (!VIEW_RENDER[v]) v = 'review';
    state.view = v;
    if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
    render();
    main.focus({ preventScroll: true });
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v !== state.view && VIEW_RENDER[v]) { state.view = v; render(); } });

  /* ---------- Boot ---------- */
  const firstOpen = checks().find(c => c.status === 'attention') || checks().find(c => c.status === 'look');
  if (firstOpen) state.open.add(firstOpen.id);
  const hv = location.hash.slice(1);
  state.view = VIEW_RENDER[hv] ? hv : 'review';
  render();
})();
</script>
</body>
</html>
