    $('#toaster').appendChild(li);
    setTimeout(() => li.remove(), 5200);
  }

  /* ---------- Export popover ---------- */
  function renderExport() {
    const opts = [
      ['master', 'Master schedule', `Excel workbook, all ${APPTS.length} meetings`],
      ['buyers', 'Buyer itineraries', `One page per buyer, ${BUY.length} pages`],
      ['suppliers', 'Desk sheets', `One page per supplier, ${SUP.length} pages`],
    ];
    $('#export-pop').innerHTML = opts.map(([k, t, d]) => `<button role="menuitem" data-export="${k}" class="flex w-full flex-col items-start rounded-md px-2.5 py-2 text-left hover:bg-accent">
      <span class="text-sm font-medium text-foreground">${t}</span><span class="text-xs text-muted-foreground">${d}</span></button>`).join('') +
      (state.locked ? '' : `<p class="border-t border-border px-2.5 pb-1 pt-2 text-xs text-muted-foreground">Exports are marked draft until the schedule is locked.</p>`);
  }
  function toggleExport(force) {
    const pop = $('#export-pop'), btn = $('#btn-export');
    const open = force ?? pop.classList.contains('hidden');
    if (open) renderExport();
    pop.classList.toggle('hidden', !open);
    btn.setAttribute('aria-expanded', String(open));
    if (open) pop.querySelector('button')?.focus();
  }

  /* ---------- Actions ---------- */
  function runAction(kind) {
    if (kind === 'run') {
      confirmDialog({
        title: 'Run matching again?',
        body: `This rebuilds all ${APPTS.length} meetings from the latest rankings. The ${D.event.manualChanges} manual changes will be discarded.`,
        confirm: 'Run matching',
        onConfirm: () => {
          state.loading = true; render();
          setTimeout(() => { state.loading = false; render(); toast('Matching finished', `${APPTS.length} meetings placed. ${flaggedBuyers().length} buyers still outside ${S.buyerMin} to ${S.buyerMax}.`); }, 900);
        },
      });
    } else if (kind === 'edit') {
      if (state.locked) return;
      closeSheet();
      state.view = 'buyers'; state.bFilter = flaggedBuyers().length ? 'below' : 'all';
      render();
      toast('Editing schedule', 'Showing buyers below the minimum. Select an open slot to add a meeting.');
    } else if (kind === 'lock') {
      if (state.locked) {
        state.locked = false; render(); toast('Schedule unlocked', 'You can edit meetings again.');
        return;
      }
      const issues = flaggedBuyers().length + flaggedSuppliers().length;
      confirmDialog({
        title: 'Lock the schedule?',
        body: `${issues ? `There are still ${issueText()}. ` : ''}Locking freezes all ${APPTS.length} meetings so they can be exported and emailed. You can unlock it later.`,
        confirm: 'Lock schedule',
        onConfirm: () => { state.locked = true; render(); toast('Schedule locked', 'Ready to export and email.'); },
      });
    } else if (kind === 'export') {
      toggleExport();
    }
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-cmd], tr.appt, summary, a');
    const pop = $('#export-pop');
    if (!pop.classList.contains('hidden') && !e.target.closest('#export-pop, #btn-export')) toggleExport(false);
    if (e.target.id === 'sheet-overlay') return closeSheet();
    if (e.target.id === 'dialog-overlay') return closeDialog();
    if (!t) return;
    const ds = t.dataset;
    const refocusKey = ['view', 'bfilter', 'bsort', 'sfilter', 'pickSlot', 'sheetTab'].find((k) => ds[k] !== undefined);
    if (refocusKey) {
      const attr = 'data-' + refocusKey.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase());
      const val = ds[refocusKey];
      queueMicrotask(() => document.querySelector(`[${attr}="${val}"]`)?.focus({ preventScroll: true }));
    }
    if (ds.action) return runAction(ds.action);
    if (ds.export) {
      toggleExport(false);
      const names = { master: 'master schedule', buyers: 'buyer itineraries', suppliers: 'desk sheets' };
      return toast(`Exported ${names[ds.export]}`, state.locked ? 'Saved to your downloads.' : 'Marked draft. Lock the schedule before emailing it out.');
    }
    if (ds.view) { state.view = ds.view; return render(); }
    if (ds.pickSlot !== undefined) {
      const n = Number(ds.pickSlot);
      state.slot = n;
      if (state.free && n) state.free = n;
      return render();
    }
    if (ds.freeSet) { state.free = Number(ds.freeSet); return render(); }
    if (ds.freeClear !== undefined) { state.free = 0; return render(); }
    if (ds.clearSearch !== undefined) { state.q = ''; $('#search').value = ''; return render(); }
    if (ds.bfilter) { state.bFilter = ds.bfilter; return render(); }
    if (ds.bsort) { state.bSort = ds.bsort; return render(); }
    if (ds.sfilter) { state.sFilter = ds.sfilter; return render(); }
    if (ds.sheetClose !== undefined) return closeSheet();
    if (ds.sheetTab) { state.sheetTab = ds.sheetTab; return renderSheet(); }
    if (ds.dialogClose !== undefined) return closeDialog();
    if (ds.dialogConfirm !== undefined) { const fn = confirmAction; closeDialog(); return fn && fn(); }
    if (ds.cmd !== undefined) return pickCommand(Number(ds.cmd));
    if (ds.buyer !== undefined) return openSheet({ kind: 'buyer', i: Number(ds.buyer), focus: Number(ds.focusSlot) || null });
    if (ds.supplier !== undefined) return openSheet({ kind: 'supplier', i: Number(ds.supplier), focus: Number(ds.focusSlot) || null });
    if (ds.appt !== undefined) return openSheet({ kind: 'appt', id: Number(ds.appt) });
  });

  $('#search').addEventListener('input', (e) => { state.q = e.target.value; RENDER[state.view](); renderToolbar(); });
  $('#search-clear').addEventListener('click', () => { state.q = ''; $('#search').value = ''; render(); $('#search').focus(); });
  $('#cmd-open').addEventListener('click', openCommand);
  $('#free-select').addEventListener('change', (e) => {
    state.free = Number(e.target.value);
    if (state.view === 'slots' && state.free) state.slot = state.free;
    render();
  });

  $('#dialog').addEventListener('input', (e) => { if (e.target.id === 'cmd-input') { cmdActive = 0; renderCommand(e.target.value); } });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return dialogKind === 'command' ? closeDialog() : openCommand(); }
    if (e.key === 'Escape') {
      if (dialogKind) return closeDialog();
      if (!$('#export-pop').classList.contains('hidden')) { toggleExport(false); return $('#btn-export').focus(); }
      if (state.sheet) return closeSheet();
    }
    if (dialogKind === 'command' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
      e.preventDefault();
      if (e.key === 'Enter') return pickCommand(cmdActive);
      cmdActive = (cmdActive + (e.key === 'ArrowDown' ? 1 : -1) + cmdItems.length) % Math.max(cmdItems.length, 1);
      renderCommand($('#cmd-input').value);
      $(`#cmd-${cmdActive}`)?.scrollIntoView({ block: 'nearest' });
      return;
    }
    // Rows on the board open their meeting with Enter or Space
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('tr.appt')) { e.preventDefault(); openSheet({ kind: 'appt', id: Number(e.target.dataset.appt) }); }
    // Arrow keys move between view tabs
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.matches?.('[role="tab"][data-view]')) {
      const i = VIEWS.findIndex((v) => v.id === state.view);
      state.view = VIEWS[(i + (e.key === 'ArrowRight' ? 1 : -1) + VIEWS.length) % VIEWS.length].id;
      render(); $(`#tab-${state.view}`).focus();
    }
    // Keep focus inside an open sheet or dialog
    if (e.key === 'Tab') {
      const root = dialogKind ? $('#dialog') : state.sheet ? $('#sheet') : null;
      if (!root) return;
      const f = [...root.querySelectorAll('button:not([disabled]), input, [tabindex="0"]')];
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      else if (!root.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); }
    }
  });

  /* Tooltip: hover or focus any [data-tip] */
  const tip = $('#tooltip');
  const showTip = (el) => {
    tip.textContent = el.dataset.tip; tip.classList.remove('hidden');
    const r = el.getBoundingClientRect(), w = tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    tip.style.top = r.bottom + 8 + 'px';
  };
  document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); else tip.classList.add('hidden'); });
  document.addEventListener('focusin', (e) => { const el = e.target.closest?.('[data-tip]'); if (el) showTip(el); else tip.classList.add('hidden'); });
  document.addEventListener('scroll', () => tip.classList.add('hidden'), true);

  /* Sticky offsets follow the toolbar height */
  const setToolbarH = () => document.documentElement.style.setProperty('--toolbar-h', (window.innerWidth >= 1024 ? $('#toolbar').offsetHeight : 0) + 'px');
  window.addEventListener('resize', setToolbarH);
  new ResizeObserver(setToolbarH).observe($('#toolbar'));
  setToolbarH();

  hydrateIcons();
  render();
})();
</script>
</body>
</html>
