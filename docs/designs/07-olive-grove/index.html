<!--
Design: 07 Olive grove
Concept: Each buyer's and supplier's afternoon is drawn as a vine with nine nodes, one per ten-minute slot: leaves are hotel meetings, berries are business meetings, the ripest (darkest) ones are mutual top-10 matches, and dashed empty buds are open slots. Everything around the vines stays quiet, so staff can scan the grove for bare branches and fix them by hand.
Palette (OKLCH):
  sage paper   oklch(0.975 0.008 150)  ~#F4F8F4  background
  forest ink   oklch(0.27 0.045 152)   ~#173320  foreground, vine stems
  olive green  oklch(0.47 0.115 152)   ~#1E6B3D  primary
  ripe olive   oklch(0.36 0.085 150)   ~#1F4D2E  mutual top-10 nodes
  leaf green   oklch(0.62 0.12 145)    ~#5E9E5A  one side top-10 nodes
  pale sage    oklch(0.86 0.055 152)   ~#BFDDC6  neither top-10 nodes, line-work
  eucalyptus   oklch(0.47 0.07 235)    ~#3D6580  business supplier
  berry        oklch(0.5 0.15 355)     ~#9A2F5E  below target (destructive)
  honey        oklch(0.8 0.13 82)      ~#E3B54A  above target (warning)
Type: Young Serif for the event name and section headings; Figtree (400 to 700, tabular numerals) for everything else.
Layout: Light header with event, status, health sentence and actions; a sticky toolbar with view switcher, search, open-slot filter and sort; then the active view. Buyer and supplier views are a "grove": one row per person, name at left, a nine-node vine aligned to a sticky time ruler, count and health at right. Slot view is a slot strip plus a desk-ordered table; health view is a two-column report. Details open in a right-side sheet with a vertical vine.
shadcn components: Button, Badge, ToggleGroup, InputGroup, Input, Kbd, Select, Command (cmd-K in Dialog), Sheet, Dialog, Popover, Tooltip, Tabs, Table, Card, Progress, Chart, Alert, Empty, Separator, ScrollArea, sonner toast.
-->

@layer components {

         border-radius: calc(var(--radius) - 2px); font-size: .875rem; font-weight: 600; white-space: nowrap;

  /* Badge */
  .badge { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .1rem .55rem; font-size: .75rem;
           font-weight: 600; line-height: 1.25rem; white-space: nowrap; border: 1px solid transparent; }
  .badge svg { width: .8rem; height: .8rem; }
  .badge-secondary { background: var(--secondary); color: var(--secondary-foreground); }

                border-bottom: 1px solid var(--border); padding: .55rem 0; }

  .vine-title-1 { display: block; font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vine-title-2 { display: block; font-size: .78rem; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vine { position: relative; height: 2.75rem; }
  .vine .stem { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .vine .stem path { fill: none; stroke: var(--vine); stroke-width: 1.75; vector-effect: non-scaling-stroke; stroke-linecap: round; }
  .nodes { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); height: 100%; place-items: center; }
  .node, .bud { display: grid; place-items: center; width: 2.2rem; height: 2.5rem; border-radius: 999px; position: relative; }
  .node svg, .bud svg { overflow: visible; }
  .node:hover svg, .bud:hover svg { transform: scale(1.18); }
  .node svg, .bud svg { transition: transform .15s; }
  .node[data-dim] { opacity: .28; }
  .node[data-hit]::after { content: ""; position: absolute; inset: 2px 1px; border-radius: 999px; box-shadow: 0 0 0 2px var(--ring); }
  .bud[data-hl]::before { content: ""; position: absolute; inset: .45rem .4rem; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 1.5px var(--primary); }

  /* the one orchestrated moment: vines grow on first load */
  .grove[data-grow] .stem { animation: grow 1s cubic-bezier(.3,.7,.3,1) both; animation-delay: calc(var(--i) * 35ms); }

  /* Table */

  .menu-item { display: flex; gap: .65rem; width: 100%; text-align: left; padding: .55rem .6rem; border-radius: calc(var(--radius) - 4px); }
  .menu-item:hover, .menu-item:focus-visible { background: var(--accent); }
  .menu-item svg { width: 1rem; height: 1rem; margin-top: .15rem; color: var(--primary); flex: none; }
  .tooltip { position: fixed; z-index: 60; pointer-events: none; max-width: 280px; background: var(--foreground); color: var(--background); font-size: .78rem;

  .toast svg { width: 1.05rem; height: 1.05rem; color: var(--primary); flex: none; margin-top: .1rem; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }

  /* Sheet schedule: vertical vine */
  .afternoon { position: relative; }
  .afternoon::before { content: ""; position: absolute; left: 5.35rem; top: 1.2rem; bottom: 1.2rem; width: 1.75px; background: var(--vine); border-radius: 2px; }
  .afternoon li { position: relative; display: grid; grid-template-columns: 4.4rem 2rem minmax(0,1fr); gap: .5rem; align-items: start; padding: .6rem .5rem; border-radius: var(--radius); }
  .afternoon li[data-focus] { background: var(--accent); }
  .afternoon .time { font-weight: 600; font-size: .82rem; padding-top: .3rem; }
  .afternoon .time small { display: block; font-weight: 400; color: var(--muted-foreground); font-size: .72rem; }
  .afternoon .glyph { display: grid; place-items: center; height: 1.9rem; background: var(--background); border-radius: 999px; position: relative; z-index: 1; }
  .afternoon li[data-focus] .glyph { background: var(--accent); }

  /* Command */
  .cmd-item { display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: calc(var(--radius) - 4px); cursor: pointer; font-size: .875rem; }
  .cmd-item[aria-selected="true"] { background: var(--accent); }

  /* Progress / chart */
  .progress { height: .5rem; background: var(--secondary); border-radius: 999px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
  .bar-track { height: 1.35rem; background: var(--muted); border-radius: 6px; overflow: hidden; }

  /* Responsive: phone */
  @media (max-width: 760px) {

  }

  @media (prefers-reduced-motion: reduce) {

  }

<script src="../shared/aw-data.js"></script>
<script>
(() => {
'use strict';
const D = window.AW_DATA;
const view = document.getElementById('view');
if (!D) { view.innerHTML = '<p class="py-10">The schedule data did not load. Check that shared/aw-data.js is served next to this folder.</p>'; return; }

/* ---------- data model (all numbers computed from AW_DATA) ---------- */
const S = D.event.settings, SLOTS = D.slots, NS = SLOTS.length, TOPN = S.mutualTopN;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const pct = (n, d) => d ? Math.round((n / d) * 100) : 0;
const short = t => t.replace(/\s?[AP]M$/i, '');
const inTop = r => r != null && r <= TOPN;
function tierOf(a) { const b = inTop(a.buyerRank), s = inTop(a.supplierRank); return b && s ? 'mutual' : (b || s ? 'one' : 'neither'); }
const TIER_LABEL = { mutual: `Mutual top ${TOPN}`, one: `One side top ${TOPN}`, neither: `Neither top ${TOPN}` };

const BUYERS = D.buyers.map((b, i) => ({ ...b, i, kind: 'b', count: 0, slots: Array(NS).fill(null) }));
const SUPS = D.suppliers.map((s, i) => ({ ...s, i, kind: 's', count: 0, slots: Array(NS).fill(null) }));
const bBy = new Map(BUYERS.map(b => [b.name, b])), sBy = new Map(SUPS.map(s => [s.name, s]));
const conflicts = [];
const APPTS = D.appointments.map((a, id) => {
  const x = { ...a, id, b: bBy.get(a.buyer), s: sBy.get(a.supplier), tier: tierOf(a) };
  [x.b, x.s].forEach(p => {
    if (!p) return;
    p.count++;
    const k = a.slot - 1;
    if (p.slots[k]) conflicts.push({ p, slot: a.slot }); else p.slots[k] = x;
  });
  return x;
});
const buyerFlag = b => b.count < S.buyerMin ? 'below' : b.count > S.buyerMax ? 'above' : null;
const supFlag = s => s.count !== S.supplierTarget ? (s.count < S.supplierTarget ? 'below' : 'above') : null;
const flagOf = p => p.kind === 'b' ? buyerFlag(p) : supFlag(p);
const buyerLabel = b => b.organization || b.name;
const personName = p => p.kind === 'b' ? buyerLabel(p) : p.name;

const ST = (() => {
  const t = { total: APPTS.length, mutual: 0, one: 0, neither: 0, blankB: 0, blankS: 0 };
  APPTS.forEach(a => { t[a.tier]++; if (a.buyerRank == null) t.blankB++; if (a.supplierRank == null) t.blankS++; });
  t.capacity = SUPS.length * S.supplierTarget;
  t.supAt = SUPS.filter(s => !supFlag(s)).length;
  t.supOff = SUPS.filter(s => supFlag(s));
  t.buyersOk = BUYERS.filter(b => !buyerFlag(b)).length;
  t.below = BUYERS.filter(b => buyerFlag(b) === 'below').sort((a, b) => a.count - b.count);
  t.above = BUYERS.filter(b => buyerFlag(b) === 'above').sort((a, b) => b.count - a.count);
  const counts = BUYERS.map(b => b.count);
  const lo = Math.min(...counts, S.buyerMin), hi = Math.max(...counts, S.buyerMax);
  t.dist = [];
  for (let c = lo; c <= hi; c++) t.dist.push({ c, n: counts.filter(x => x === c).length });
  t.issues = t.below.length + t.above.length + t.supOff.length + conflicts.length;
  t.perSlot = SLOTS.map((sl, k) => {
    const list = APPTS.filter(a => a.slot === sl.n);
    return { n: list.length,
             freeB: BUYERS.filter(b => !b.slots[k]).length, freeS: SUPS.filter(s => !s.slots[k]).length };
  });
  return t;
})();

/* ---------- state ---------- */
const state = { view: 'buyers', q: '', open: 0, slot: 1, sort: { buyers: 'attention', suppliers: 'desk' }, status: 'draft', editing: false, grown: false };

/* ---------- glyphs ---------- */
function glyph(a, k, size = 24) {
  const fill = a.tier === 'mutual' ? 'var(--mutual)' : a.tier === 'one' ? 'var(--one-side)' : 'var(--neither)';
  const vein = a.tier === 'neither' ? 'var(--vine)' : 'var(--sage)';
  const edge = a.tier === 'neither' ? 'stroke="var(--vine)" stroke-width="1.2"' : '';
  if (a.type === 'business') {
    return `<svg width="${size}" height="${size}" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="6.6" fill="${fill}" ${edge}/>` +
      `<circle cx="-2.2" cy="-2.2" r="1.6" fill="${vein}"/></svg>`;
  }
  const rot = k % 2 ? 32 : -32;
  return `<svg width="${size}" height="${size}" viewBox="-12 -12 24 24" aria-hidden="true"><g transform="rotate(${rot})">` +
    `<path d="M-10 0 C-6 -6.6 6 -6.6 10 0 C6 6.6 -6 6.6 -10 0Z" fill="${fill}" ${edge}/>` +
    `<path d="M-8 0 L8 0 M-1.5 -3.6 L1 3.4" stroke="${vein}" stroke-width="1" stroke-linecap="round"/></g></svg>`;
}
function budGlyph(flag, size = 24) {
  const c = flag === 'below' ? 'var(--destructive)' : 'var(--sage-strong)';
  return `<svg width="${size}" height="${size}" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="5" fill="var(--background)" stroke="${c}" stroke-width="1.6" stroke-dasharray="2.4 2"/></svg>`;
}
function stemPath(n) {
  const w = 100, y = 20, amp = 7.5;
  let d = `M0 ${y} L${w / 2} ${y}`;
  for (let i = 0; i < n - 1; i++) {
    const x0 = w * (i + .5), x1 = w * (i + 1.5), dir = i % 2 ? 1 : -1;
    d += ` C${x0 + w * .38} ${y + dir * amp} ${x1 - w * .38} ${y + dir * amp} ${x1} ${y}`;
  }
  return d + ` L${w * n} ${y}`;
}
const STEM = stemPath(NS);
const TENDRIL = `<svg class="tendril" width="30" height="44" viewBox="0 0 30 44" aria-hidden="true"><path d="M0 22 C9 22 15 18 15 12 C15 6 9 5 7.5 8.5 C6 12 10.5 13.5 12 11"/></svg>`;

function rankHTML(r) {
  if (r == null) return `<span class="rank" data-blank title="Left blank"><span aria-hidden="true">–</span><span class="sr-only">blank</span></span>`;
  return `<span class="rank" ${r <= TOPN ? 'data-top' : ''}>${r}</span>`;
}
const typeBadge = t => `<span data-slot="badge" class="badge badge-${t === 'business' ? 'business' : 'hotel'}">${t === 'business' ? 'Business' : 'Hotel'}</span>`;
const mutualBadge = () => `<span data-slot="badge" class="badge badge-mutual">${glyph({ tier: 'mutual', type: 'business' }, 0, 12)}Mutual top ${TOPN}</span>`;
function flagBadge(p) {
  const f = flagOf(p); if (!f) return '';
  if (p.kind === 'b') return f === 'below'
    ? `<span data-slot="badge" class="badge badge-destructive">Below ${S.buyerMin}</span>`
    : `<span data-slot="badge" class="badge badge-warning">Above ${S.buyerMax}</span>`;
  return `<span data-slot="badge" class="badge ${f === 'below' ? 'badge-destructive' : 'badge-warning'}">Not at ${S.supplierTarget}</span>`;
}
function apptLabel(a, from) {
  const sl = SLOTS[a.slot - 1];
  const other = from === 'b' ? `${a.supplier}, ${a.type}` : buyerLabel(a.b || { name: a.buyer });
  const r = v => v == null ? 'blank' : v;
  return `${sl.start}, ${other}, desk ${a.desk}. Buyer rank ${r(a.buyerRank)}, supplier rank ${r(a.supplierRank)}. ${TIER_LABEL[a.tier]}.`;
}

/* ---------- filtering ---------- */
const qm = s => String(s || '').toLowerCase().includes(state.q);
function personMatch(p) {
  if (!state.q) return { ok: true, hits: null };
  const self = p.kind === 'b' ? (qm(p.name) || qm(p.organization) || qm(p.title)) : qm(p.name);
  if (self) return { ok: true, hits: null };
  const hits = new Set();
  p.slots.forEach(a => { if (!a) return; const o = p.kind === 'b' ? a.s : a.b; if (o && (qm(o.name) || qm(o.organization))) hits.add(a.id); });
  return { ok: hits.size > 0, hits: hits.size ? hits : null };
}
const freeIn = (p, n) => !n || !p.slots[n - 1];

/* ---------- views ---------- */
const VIEWS = [
  { id: 'buyers', label: 'Buyers', icon: 'users' },
  { id: 'suppliers', label: 'Suppliers', icon: 'store' },
  { id: 'slots', label: 'Time slots', icon: 'clock' },
  { id: 'health', label: 'Health', icon: 'heart-pulse' },
];
const SORTS = {
  buyers: [['attention', 'Needs attention first'], ['fewest', 'Fewest meetings'], ['az', 'A to Z']],
  suppliers: [['desk', 'Desk number'], ['az', 'A to Z'], ['attention', 'Needs attention first']],
};

function render() {
  document.getElementById('views').innerHTML = VIEWS.map(v =>
    `<button data-slot="toggle-group-item" class="toggle-item" aria-pressed="${state.view === v.id}" data-view="${v.id}"><i data-lucide="${v.icon}" class="max-sm:hidden"></i>${v.label}` +
    (v.id === 'health' && ST.issues ? `<span data-slot="badge" class="badge badge-destructive" aria-label="${ST.issues} issues">${ST.issues}</span>` : '') + `</button>`).join('');
  const sortWrap = document.getElementById('sort-wrap');
  sortWrap.hidden = !SORTS[state.view];
  if (SORTS[state.view]) document.getElementById('sort').innerHTML = SORTS[state.view].map(([v, l]) => `<option value="${v}" ${state.sort[state.view] === v ? 'selected' : ''}>${l}</option>`).join('');
  const of = document.getElementById('open-filter');
  of.value = String(state.open); of.dataset.active = state.open ? 'true' : 'false';
  ({ buyers: renderBuyerView, suppliers: renderSupplierView, slots: renderSlotView, health: renderHealthView })[state.view]();
  icons();
  positionHead();
}

function filterLine(shown, total, noun) {
  const parts = [];
  if (state.q) parts.push(`matching “${esc(state.q)}”`);
  if (state.open) parts.push(`free at ${SLOTS[state.open - 1].start}`);
  if (!parts.length) return '';
  return `<div class="flex flex-wrap items-center gap-3 pt-4 text-sm"><span>Showing ${shown} of ${plural(total, noun)}, ${parts.join(' and ')}.</span>` +
    `<button class="btn btn-link text-sm" data-action="clear">Clear filters</button></div>`;
}
function emptyHTML(title, body) {
  return `<div data-slot="empty" class="flex flex-col items-center text-center gap-3 py-16 px-4">
    <svg width="44" height="44" viewBox="-22 -22 44 44" aria-hidden="true"><path d="M-18 6 C-8 6 -4 0 0 0 C6 0 10 8 18 4" fill="none" stroke="var(--vine)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-6" cy="3" r="4.5" fill="none" stroke="var(--sage-strong)" stroke-width="1.6" stroke-dasharray="2.4 2"/><circle cx="8" cy="3" r="4.5" fill="none" stroke="var(--sage-strong)" stroke-width="1.6" stroke-dasharray="2.4 2"/></svg>
    <h3 data-slot="empty-title" class="font-serif text-lg">${title}</h3><p data-slot="empty-description" class="text-sm text-muted-foreground max-w-[44ch]">${body}</p>
    ${state.q || state.open ? '<button class="btn btn-outline btn-sm" data-action="clear">Clear filters</button>' : ''}</div>`;
}
function legendHTML() {
  const item = (svg, label) => `<span class="inline-flex items-center gap-1">${svg}<span>${label}</span></span>`;
  return `<div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-muted-foreground pt-4" aria-label="Legend">
    ${item(glyph({ tier: 'one', type: 'hotel' }, 0, 20), 'Hotel')}
    ${item(glyph({ tier: 'one', type: 'business' }, 0, 20), 'Business')}
    ${item(glyph({ tier: 'mutual', type: 'hotel' }, 1, 20), `Mutual top ${TOPN}`)}
    ${item(glyph({ tier: 'one', type: 'hotel' }, 1, 20), `One side top ${TOPN}`)}
    ${item(glyph({ tier: 'neither', type: 'hotel' }, 1, 20), `Neither top ${TOPN}`)}
    ${item(budGlyph(null, 20), 'Open slot')}
    ${item(budGlyph('below', 20), 'Open slot, buyer below target')}</div>`;
}
function groveHTML(people, kind, total) {
  const noun = kind === 'b' ? 'buyer' : 'supplier';
  const head = `<div class="grove-head grove-grid" style="--n:${NS}" id="grove-head">
    <span class="head-name text-xs font-semibold text-muted-foreground">${kind === 'b' ? 'Buyer' : 'Supplier and desk'}</span>
    <div class="ruler" style="--n:${NS}">${SLOTS.map(s => `<span ${state.open === s.n ? 'data-hl' : ''} title="${esc(s.start)} to ${esc(s.end)}">${esc(short(s.start))}</span>`).join('')}</div>
    <span class="head-count text-xs font-semibold text-muted-foreground">Meetings</span></div>`;
  if (!people.length) return legendHTML() + filterLine(0, total, noun) + head + emptyHTML(`No ${noun}s match`, state.open
    ? `Nobody here is free at ${esc(SLOTS[state.open - 1].start)}${state.q ? ' with that search' : ''}. Try another slot.`
    : `Nothing matches “${esc(state.q)}”. Search by ${kind === 'b' ? 'buyer, organization or a supplier they meet' : 'supplier or a buyer they meet'}.`);
  const rows = people.map(({ p, hits }, idx) => {
    const flag = flagOf(p);
    const i = Math.min(idx, 18);
    let first = true;
    const cells = p.slots.map((a, k) => {
      const tab = first ? 0 : -1; first = false;
      if (!a) return `<button class="bud" style="--k:${k}" tabindex="${tab}" data-person="${kind}:${p.i}" data-slotn="${k + 1}" ${state.open === k + 1 ? 'data-hl' : ''}
        aria-label="${esc(SLOTS[k].start)}, open slot">${budGlyph(kind === 'b' ? flag : null, 28)}</button>`;
      const hit = hits ? (hits.has(a.id) ? 'data-hit' : 'data-dim') : '';
      return `<button class="node" style="--k:${k}" tabindex="${tab}" data-appt="${a.id}" data-from="${kind}" ${hit} aria-label="${esc(apptLabel(a, kind))}">${glyph(a, k, 30)}</button>`;
    }).join('');
    const nameA = kind === 'b' ? esc(buyerLabel(p)) : esc(p.name);
    const nameB = kind === 'b' ? esc(p.title) : `Desk ${p.desk}, ${p.type === 'business' ? 'business' : 'hotel'}`;
    return `<li class="vine-row grove-grid" style="--i:${i}">
      <button class="vine-name" data-person="${kind}:${p.i}" title="${esc(p.name)}"><span class="vine-title-1">${nameA}</span><span class="vine-title-2">${nameB}</span></button>
      <div class="vine" role="group" aria-label="${esc(personName(p))}, afternoon schedule">
        <svg class="stem" viewBox="0 0 ${NS * 100} 40" preserveAspectRatio="none" aria-hidden="true"><path d="${STEM}"/></svg>
        <div class="nodes" style="--n:${NS}">${cells}</div></div>
      <div class="vine-count">${TENDRIL}<span><span class="count-num">${p.count}</span> <span class="count-of">of ${NS}</span></span>${flagBadge(p)}</div></li>`;
  }).join('');
  return legendHTML() + filterLine(people.length, total, noun) + head +
    `<ol class="grove" ${state.grown ? '' : 'data-grow'} data-slot="table" aria-label="${noun}s">${rows}</ol>`;
}
function sortPeople(list, mode) {
  const byName = (a, b) => personName(a.p).localeCompare(personName(b.p));
  const rank = p => { const f = flagOf(p); return f === 'below' ? 0 : f === 'above' ? 1 : 2; };
  return list.sort((a, b) => mode === 'attention' ? (rank(a.p) - rank(b.p) || a.p.count - b.p.count || byName(a, b))
    : mode === 'fewest' ? (a.p.count - b.p.count || byName(a, b))
    : mode === 'desk' ? (a.p.desk - b.p.desk) : byName(a, b));
}

function renderBuyerView() {
  const list = BUYERS.map(p => ({ p, ...personMatch(p) })).filter(x => x.ok && freeIn(x.p, state.open));
  view.innerHTML = groveHTML(sortPeople(list, state.sort.buyers), 'b', BUYERS.length);
  state.grown = true;
}
function renderSupplierView() {

/* ---------- header ---------- */

  const st = document.getElementById('status-badge');

  document.querySelector('[data-export-count="s"]').textContent = `${SUPS.length} PDFs with desk numbers`;

}

/* ---------- sheet ---------- */
let sheetReturn = null;
function scheduleHTML(p, focusSlot) {
  const flag = flagOf(p);
  const rows = p.slots.map((a, k) => {
    const sl = SLOTS[k], foc = focusSlot === k + 1 ? 'data-focus' : '';
    const time = `<div class="time">${esc(sl.start)}<small>to ${esc(sl.end)}</small></div>`;
    if (!a) {
      const freeOther = (p.kind === 'b' ? SUPS : BUYERS).filter(o => !o.slots[k]).length;
      return `<li ${foc}>${time}<div class="glyph">${budGlyph(p.kind === 'b' ? flag : null, 26)}</div>
        <div class="pt-1"><div class="font-semibold">Open</div><div class="text-sm text-muted-foreground">No meeting. ${freeOther ? `${plural(freeOther, p.kind === 'b' ? 'supplier is' : 'buyer is', p.kind === 'b' ? 'suppliers are' : 'buyers are')} also free now.` : `No ${p.kind === 'b' ? 'supplier' : 'buyer'} is free now, so a meeting here needs a swap.`}</div>
        ${state.editing ? `<button class="btn btn-outline btn-sm mt-2" data-action="add" data-slotn="${k + 1}" data-person="${p.kind}:${p.i}"><i data-lucide="plus"></i>Add a meeting</button>` : ''}</div></li>`;
    }
    const other = p.kind === 'b' ? a.s : a.b;
    const otherName = p.kind === 'b' ? a.supplier : (a.b ? buyerLabel(a.b) : a.buyer);
    return `<li ${foc}>${time}<div class="glyph">${glyph(a, k, 26)}</div>
      <div class="min-w-0 pt-0.5">
        ${other ? `<button class="text-left font-semibold hover:underline underline-offset-2" data-person="${other.kind}:${other.i}">${esc(otherName)}</button>` : `<span class="font-semibold">${esc(otherName)}</span>`}
        ${p.kind === 's' && a.b ? `<div class="text-xs text-muted-foreground">${esc(a.b.title)}</div>` : ''}
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-1.5 text-sm">
          <span>Desk <b>${a.desk}</b></span>${typeBadge(a.type)}
          <span>Buyer rank ${rankHTML(a.buyerRank)}</span><span>Supplier rank ${rankHTML(a.supplierRank)}</span>
          ${a.tier === 'mutual' ? mutualBadge() : ''}</div></div></li>`;
  }).join('');
  return `<ol class="afternoon" aria-label="Afternoon schedule">${rows}</ol>`;
}
function openSheet(kind, i, opts = {}) {
  const p = (kind === 'b' ? BUYERS : SUPS)[i]; if (!p) return;
  const a = opts.appt != null ? APPTS[opts.appt] : null;
  sheetReturn = sheetReturn || document.activeElement;
  document.getElementById('sheet-title').textContent = personName(p);
  const free = p.slots.filter(x => !x).length;
  document.getElementById('sheet-desc').innerHTML = (p.kind === 'b' ? esc(p.title) : `Desk ${p.desk}, ${p.type === 'business' ? 'business' : 'hotel'}`) +
    `<span class="flex flex-wrap items-center gap-2 mt-2"><span class="badge badge-secondary">${p.count} of ${NS} slots booked</span>${free ? `<span class="badge badge-outline">${plural(free, 'open slot')}</span>` : ''}${flagBadge(p)}</span>`;
  let body = '';
  if (a && a.b && a.s) {
    const tabs = [['b', a.b], ['s', a.s]];
    body += `<div data-slot="tabs" class="mb-4"><div data-slot="tabs-list" role="tablist" class="toggle-group w-full">` +
      tabs.map(([k, q]) => `<button role="tab" data-slot="tabs-trigger" class="toggle-item flex-1 min-w-0" aria-selected="${k === kind}" aria-pressed="${k === kind}" data-person="${k}:${q.i}" data-focus-slot="${a.slot}" data-appt-ctx="${a.id}"><span class="truncate">${k === 'b' ? 'Buyer' : 'Supplier'}: ${esc(personName(q))}</span></button>`).join('') + `</div></div>`;
  }
  body += scheduleHTML(p, opts.slot || (a && a.slot));
  const b = document.getElementById('sheet-body'); b.innerHTML = body; b.scrollTop = 0;
  const root = document.getElementById('sheet-root'); root.hidden = false;
  icons();
  const f = b.querySelector('li[data-focus]'); if (f) f.scrollIntoView({ block: 'center' });
  root.querySelector('[data-close].btn').focus();
}
function closeLayer(root) {
  root.hidden = true;
  if (root.id === 'sheet-root') { const r = sheetReturn; sheetReturn = null; if (r && document.contains(r)) r.focus(); }
  else if (root._ret && document.contains(root._ret)) root._ret.focus();
}

/* ---------- dialog / toast / popover / tooltip ---------- */
let dialogAction = null;
function confirmDialog(title, desc, ok, fn) {
  const root = document.getElementById('dialog-root'); root._ret = document.activeElement;
  document.getElementById('dialog-title').textContent = title;
  document.getElementById('dialog-desc').textContent = desc;
  document.getElementById('dialog-ok').textContent = ok;
  dialogAction = fn; root.hidden = false; document.getElementById('dialog-ok').focus();
}
function toast(title, desc = '', icon = 'check-circle-2') {
  const li = document.createElement('li');
  li.className = 'toast'; li.setAttribute('data-slot', 'toast');
  li.innerHTML = `<i data-lucide="${icon}"></i><div><div class="font-semibold">${esc(title)}</div>${desc ? `<div class="text-muted-foreground mt-0.5">${esc(desc)}</div>` : ''}</div>`;
  const t = document.getElementById('toaster'); t.appendChild(li); icons();
  while (t.children.length > 3) t.firstChild.remove();
  setTimeout(() => li.remove(), 4500);
}
const tip = document.getElementById('tooltip');
function showTip(el) {
  const a = APPTS[+el.dataset.appt]; if (!a) return;
  const from = el.dataset.from, sl = SLOTS[a.slot - 1];
  const r = v => v == null ? '–' : v;
  tip.innerHTML = `<b>${esc(from === 'b' ? a.supplier : (a.b ? buyerLabel(a.b) : a.buyer))}</b><br>${esc(sl.start)}, desk ${a.desk}, ${a.type === 'business' ? 'business' : 'hotel'}<br>Buyer rank ${r(a.buyerRank)}, supplier rank ${r(a.supplierRank)}<br>${TIER_LABEL[a.tier]}`;
  tip.hidden = false;
  const rc = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = rc.left + rc.width / 2 - tw / 2, y = rc.top - th - 8;
  if (y < 8) y = rc.bottom + 8;
  tip.style.left = Math.max(8, Math.min(x, innerWidth - tw - 8)) + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.hidden = true; };

/* ---------- command palette ---------- */
let cmdSel = 0, cmdItems = [];
function renderCmd() {
  const q = document.getElementById('cmd-input').value.trim().toLowerCase();
  const m = s => String(s || '').toLowerCase().includes(q);
  const bs = BUYERS.filter(b => !q || m(b.name) || m(b.organization)).slice(0, 7);
  const ss = SUPS.filter(s => !q || m(s.name)).slice(0, 7);
  cmdItems = [...bs, ...ss]; cmdSel = Math.min(cmdSel, Math.max(cmdItems.length - 1, 0));
  const item = (p, idx) => `<div class="cmd-item" role="option" id="cmd-${idx}" data-slot="command-item" aria-selected="${idx === cmdSel}" data-idx="${idx}">
      ${p.kind === 'b' ? '<i data-lucide="user" class="size-4 text-muted-foreground"></i>' : '<i data-lucide="store" class="size-4 text-muted-foreground"></i>'}
      <span class="truncate flex-1">${esc(personName(p))}</span><span class="text-xs text-muted-foreground">${p.kind === 's' ? 'Desk ' + p.desk : p.count + ' of ' + NS}</span></div>`;
  const list = document.getElementById('cmd-list');
  list.innerHTML = !cmdItems.length ? `<p data-slot="command-empty" class="text-sm text-muted-foreground text-center py-8">No buyer or supplier matches “${esc(q)}”.</p>` :
    (bs.length ? `<div data-slot="command-group" role="group" aria-label="Buyers"><div class="text-xs font-semibold text-muted-foreground px-2 pt-2 pb-1">Buyers</div>${bs.map((p, i) => item(p, i)).join('')}</div>` : '') +
    (ss.length ? `<div data-slot="command-group" role="group" aria-label="Suppliers"><div class="text-xs font-semibold text-muted-foreground px-2 pt-3 pb-1">Suppliers</div>${ss.map((p, i) => item(p, i + bs.length)).join('')}</div>` : '');
  document.getElementById('cmd-input').setAttribute('aria-activedescendant', cmdItems.length ? 'cmd-' + cmdSel : '');
  icons();
}
function openCmd() {
  const root = document.getElementById('cmd-root'); root._ret = document.activeElement;
  root.hidden = false; const inp = document.getElementById('cmd-input'); inp.value = ''; cmdSel = 0; renderCmd(); inp.focus();
}
function pickCmd(idx) {
  const p = cmdItems[idx]; if (!p) return;
  const root = document.getElementById('cmd-root'); root.hidden = true;
  sheetReturn = root._ret; openSheet(p.kind, p.i);
}

/* ---------- utilities ---------- */
function icons() { if (window.lucide) window.lucide.createIcons({ attrs: { 'aria-hidden': 'true' } }); }
function positionHead() {
  const h = document.getElementById('grove-head'), tb = document.getElementById('toolbar');
  if (h) h.style.top = (getComputedStyle(tb).position === 'sticky' ? tb.offsetHeight : 0) + 'px';
}
function setView(v) { state.view = v; render(); }
function trap(e, root) {
  const f = [...root.querySelectorAll('button:not([disabled]), input, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
  if (!f.length) return; const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---------- events ---------- */
document.getElementById('open-filter').innerHTML = `<option value="0">Any time</option>` + SLOTS.map(s => `<option value="${s.n}">Free at ${esc(s.start)}</option>`).join('');

document.addEventListener('click', e => {
  const pop = document.getElementById('export-pop');
  if (!pop.hidden && !e.target.closest('[data-slot="popover"]')) togglePop(false);
  const t = e.target.closest('button, tr, [data-close], .cmd-item'); if (!t) return;
  if (t.matches('[data-close]')) { closeLayer(t.closest('[data-slot="sheet"], [data-slot="dialog"]')); return; }
  if (t.classList.contains('cmd-item')) { pickCmd(+t.dataset.idx); return; }
  if (t.dataset.view) { setView(t.dataset.view); return; }
  if (t.dataset.slotpick) { state.slot = +t.dataset.slotpick; if (state.open) state.open = state.slot; render(); return; }
  if (t.dataset.action === 'clear') { state.q = ''; state.open = 0; document.getElementById('search').value = ''; render(); return; }
  if (t.dataset.action === 'health') { setView('health'); document.getElementById('view').focus(); return; }
  if (t.dataset.action === 'add') {
    const n = +t.dataset.slotn, k = n - 1;
    const free = SUPS.filter(s => !s.slots[k]);
    toast(free.length ? `${plural(free.length, 'supplier')} free at ${SLOTS[k].start}` : `No supplier is free at ${SLOTS[k].start}`,
      free.length ? free.map(s => s.name).slice(0, 3).join(', ') : 'Move one of their meetings to another slot first, then add this one.', free.length ? 'check-circle-2' : 'info');
    return;
  }
  if (t.dataset.appt != null && t.dataset.from) {
    hideTip();
    const a = APPTS[+t.dataset.appt]; const p = t.dataset.from === 's' ? a.s : a.b;
    if (p) openSheet(p.kind, p.i, { appt: a.id }); return;
  }
  if (t.dataset.person) {
    const [k, i] = t.dataset.person.split(':');
    openSheet(k, +i, { slot: +(t.dataset.slotn || t.dataset.focusSlot) || 0, appt: t.dataset.apptCtx != null ? +t.dataset.apptCtx : null });
    return;
  }
  if (t.dataset.export) { togglePop(false); toast(`${t.dataset.export} exported`, `From the ${state.status === 'locked' ? 'locked' : 'draft'} schedule, ${ST.total} appointments.`, 'download'); return; }
  if (t.id === 'act-export') { togglePop(document.getElementById('export-pop').hidden); return; }
  if (t.id === 'act-run') {
    confirmDialog('Run matching again?', `This rebuilds the schedule from everyone's rankings and replaces the current one, including ${plural(D.event.manualChanges, 'manual change')}.`, 'Run matching',
      () => toast('Matching started', 'The new schedule replaces this one when it finishes.', 'refresh-cw'));
    return;
  }
  if (t.id === 'act-edit') {
    state.editing = !state.editing; renderHeader();
    toast(state.editing ? 'Editing on' : 'Editing off', state.editing ? 'Open any buyer or supplier and use their open slots to add or move meetings.' : 'Your changes are kept in the draft.', 'pencil');
    return;
  }
  if (t.id === 'act-lock') {
    if (state.status === 'locked') { state.status = 'draft'; renderHeader(); toast('Schedule unlocked', 'Staff can edit appointments again.', 'lock-open'); return; }
    confirmDialog('Lock this schedule?', `Nobody can change appointments once it's locked. Export and emails use the locked version. ${ST.issues ? `${plural(ST.issues, 'issue')} still open in Health.` : ''}`, 'Lock schedule',
      () => { state.status = 'locked'; state.editing = false; renderHeader(); toast('Schedule locked', 'Ready to export and email.', 'lock'); });
    return;
  }
  if (t.id === 'dialog-ok') { const fn = dialogAction; closeLayer(document.getElementById('dialog-root')); if (fn) fn(); return; }
  if (t.id === 'cmdk-hint') { openCmd(); return; }
});
function togglePop(open) {
  const pop = document.getElementById('export-pop'), btn = document.getElementById('act-export');
  pop.hidden = !open; btn.setAttribute('aria-expanded', String(open));
  if (open) pop.querySelector('.menu-item').focus();
}

document.addEventListener('keydown', e => {
  const layers = ['cmd-root', 'dialog-root', 'sheet-root'].map(id => document.getElementById(id)).filter(r => !r.hidden);
  if (e.key === 'Escape') {
    if (!document.getElementById('export-pop').hidden) { togglePop(false); document.getElementById('act-export').focus(); return; }
    if (layers.length) { closeLayer(layers[0]); return; }
  }
  if (e.key === 'Tab' && layers.length) { trap(e, layers[0]); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if (e.key === '/' && !layers.length && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('search').focus(); return; }
  if (!document.getElementById('cmd-root').hidden && document.activeElement.id === 'cmd-input') {
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, cmdItems.length - 1); renderCmd(); document.getElementById('cmd-' + cmdSel)?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); renderCmd(); document.getElementById('cmd-' + cmdSel)?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); pickCmd(cmdSel); }
    return;
  }
  // roving focus inside a vine
  const n = document.activeElement.closest?.('.nodes');
  if (n && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const items = [...n.children], i = items.indexOf(document.activeElement);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)));
    e.preventDefault(); items.forEach(x => x.tabIndex = -1); items[j].tabIndex = 0; items[j].focus();
  }
  if (e.key === 'Enter' && document.activeElement.matches('tr[data-appt], tr[data-person]')) document.activeElement.click();
});
document.getElementById('cmd-input').addEventListener('input', () => { cmdSel = 0; renderCmd(); });
document.getElementById('cmd-list').addEventListener('mousemove', e => {
  const it = e.target.closest('.cmd-item'); if (it && +it.dataset.idx !== cmdSel) { cmdSel = +it.dataset.idx; renderCmd(); }
});

let qTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 120);
});
document.getElementById('open-filter').addEventListener('change', e => { state.open = +e.target.value; if (state.open) state.slot = state.open; render(); });
document.getElementById('sort').addEventListener('change', e => { state.sort[state.view] = e.target.value; render(); });

view.addEventListener('pointerover', e => { const n = e.target.closest('.node'); if (n) showTip(n); });
view.addEventListener('pointerout', e => { if (e.target.closest('.node')) hideTip(); });
view.addEventListener('focusin', e => { if (e.target.matches('.node')) showTip(e.target); });
view.addEventListener('focusout', hideTip);
addEventListener('scroll', hideTip, { passive: true });
addEventListener('resize', positionHead);

renderHeader();
render();
addEventListener('load', () => { icons(); positionHead(); });
})();
</script>
</body>
</html>
