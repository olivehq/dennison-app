  function personHead(name) {
    const c = W.count(name), h = health(c), open = SLOTS.filter(s => !W.at(name, s.n)).length;
    return `<div class="flex flex-wrap items-center gap-2 mb-3"><span class="badge ${h === "ok" ? "badge-ok" : "badge-warning"}">${plural(c, "meeting")}${h === "low" ? `, below ${S.buyerMin}` : h === "high" ? `, above ${S.buyerMax}` : ""}</span><span class="badge badge-outline">${plural(open, "open slot")}</span></div>`;
  }
  function openSheet(s) {
    st.sheet = s; renderSheet(); icons();
    $("#sheet-title")?.focus({ preventScroll: true });
  }

  /* ============================================================
     Pending tray
     ============================================================ */
  function renderTray() {
    const el = $("#tray");
    if (!st.edit || st.locked) { el.hidden = true; $("#toaster").style.bottom = "16px"; return; }
    el.hidden = false;
    requestAnimationFrame(() => { $("#toaster").style.bottom = (el.hidden ? 16 : el.offsetHeight + 12) + "px"; });
    const now = metricsCache(), was = metrics(B0);
    const pickMsg = st.pick
      ? `<div class="px-4 sm:px-6 py-2 bg-accent text-accent-foreground text-[12.5px] flex flex-wrap items-center gap-3"><i data-lucide="hand" class="size-4"></i><span><b>Holding ${esc(st.pick.type === "seat" ? who(W.seatAt(st.pick.slot, st.pick.supplier).buyer) : who(st.pick.buyer))}.</b> ${st.pick.type === "seat" ? `Choose another desk in the ${esc(time(st.pick.slot))} column.` : "Choose a desk in a slot where they are free."} Green outlines are safe, orange change a count, hatched are blocked.</span><button class="btn btn-ghost btn-sm !h-7" data-act="cancel-pick">Put it back <kbd class="kbd">Esc</kbd></button></div>` : "";
    const delta = (a, b) => a === b ? `${b}` : `${a} → ${b}`;
    el.innerHTML = `${pickMsg}
      <div class="px-4 sm:px-6 py-3 flex flex-wrap items-center gap-x-6 gap-y-3">
        <div class="min-w-[180px]">
          <h2 data-slot="card-title" class="font-bold text-[14px] flex items-center gap-2">Pending changes <span class="badge ${ops.length ? "badge-ink" : "badge-outline"}">${ops.length}</span></h2>
          <p data-slot="card-description" class="text-[12px] text-muted-foreground mt-0.5">Buyers at ${S.buyerMin} to ${S.buyerMax}: <b class="text-foreground">${delta(was.inRange, now.inRange)}</b> of ${BUY.length}. Mutual top ${S.mutualTopN}: <b class="text-foreground">${delta(was.mutual, now.mutual)}</b>.</p>
        </div>
        <div class="receipts flex-1 min-w-0 flex gap-2 overflow-x-auto pb-1" data-slot="scroll-area">
          ${ops.length ? ops.map((o, i) => `<div class="receipt"${o.warn ? " data-warn" : ""}><b>${i + 1}. ${esc(o.label)}</b><span class="text-muted-foreground">${esc(o.detail)}</span></div>`).join("")
            : `<div data-slot="empty" class="text-[12.5px] text-muted-foreground self-center">No changes yet. Drag a tag onto another desk in the same slot to swap, or seat a free buyer from the top row.</div>`}
        </div>
        <div data-slot="card-footer" class="flex gap-2 ml-auto">
          <button class="btn btn-ghost btn-sm" data-act="undo" ${ops.length ? "" : "disabled"}><i data-lucide="undo-2"></i>Undo last</button>
          <button class="btn btn-outline btn-sm" data-act="discard" ${ops.length ? "" : "disabled"}>Discard</button>
          <button class="btn btn-default btn-sm" data-act="save" ${ops.length ? "" : "disabled"}><i data-lucide="check"></i>Save changes</button>
        </div>
      </div>`;
  }

  /* ============================================================
     Command palette
     ============================================================ */
  const cmdk = $("#cmdk"), cmdIn = $("#cmdk-input"), cmdList = $("#cmdk-list");
  let cmdItems = [], cmdSel = 0;
  function renderCmd() {
    const q = norm(cmdIn.value);
    const bs = BUY.filter(b => !q || buyerHay.get(b.name).includes(q)).slice(0, 8).map(b => ({ kind: "buyer", name: b.name, t: b.organization, s: `${b.title}, ${W.count(b.name)} meetings` }));
    const ss = SUP.filter(s => !q || s.name.toLowerCase().includes(q)).slice(0, 6).map(s => ({ kind: "supplier", name: s.name, t: s.name, s: `Desk ${s.desk}, ${kindWord(s.type)}` }));
    cmdItems = [...bs, ...ss];
    cmdSel = Math.min(cmdSel, Math.max(0, cmdItems.length - 1));
    const group = (label, list, off) => list.length ? `<div data-slot="command-group" role="group" aria-label="${label}"><div class="px-2 pt-2 pb-1 text-[11.5px] font-semibold text-muted-foreground">${label}</div>${list.map((it, i) => `<button class="cmd-item" role="option" data-slot="command-item" data-ci="${off + i}" aria-selected="${off + i === cmdSel}">${it.kind === "supplier" ? `<span class="glyph" data-kind="${sup(it.name).type}"></span>` : `<i data-lucide="user-round" class="size-4 text-muted-foreground"></i>`}<span class="flex flex-col min-w-0"><span class="truncate font-semibold">${esc(it.t)}</span><small class="truncate">${esc(it.s)}</small></span></button>`).join("")}</div>` : "";
    cmdList.innerHTML = cmdItems.length ? group("Buyers", bs, 0) + group("Suppliers", ss, bs.length) : `<div data-slot="command-empty" class="py-8 text-center text-[13px] text-muted-foreground">No buyer or supplier matches “${esc(cmdIn.value)}”.</div>`;
    icons();
  }
  function chooseCmd(i) {
    const it = cmdItems[i]; if (!it) return;
    cmdk.close();
    if (it.kind === "buyer") { st.pinned = it.name; commitView(); openSheet({ kind: "buyer", name: it.name }); scrollToPinned(); }
    else { openSheet({ kind: "supplier", name: it.name }); if (st.view === "board") scrollToRow(SI.get(it.name)); }
  }
  function openCmd() { cmdIn.value = ""; cmdSel = 0; renderCmd(); cmdk.showModal(); cmdIn.focus(); }

  /* ============================================================
     Render root
     ============================================================ */
  let iconTimer = 0;
  function icons() {
    if (!window.lucide) return;
    cancelAnimationFrame(iconTimer);
    iconTimer = requestAnimationFrame(() => window.lucide.createIcons({ attrs: { "aria-hidden": "true" } }));
  }
  function render() {
    _mc = null;
    renderHeader(); renderToolbar(); renderPinBar();
    const board = st.view === "board";
    $("#board-view").classList.toggle("hidden", !board);
    $("#list-view").classList.toggle("hidden", board);
    if (board) renderBoard();
    else ({ buyers: renderBuyers, suppliers: renderSuppliers, quality: renderQuality })[st.view]();
    renderSheet(); renderTray(); icons();
  }
  function commitView() { render(); }
  function scrollToPinned() {
    if (st.view !== "board" || !st.pinned) return;
    requestAnimationFrame(() => {
      const el = $('#board-grid .chip[data-state="pinned"]');
      el?.scrollIntoView({ block: "center", inline: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    });
  }
  function scrollToRow(si) {
    requestAnimationFrame(() => {
      const el = $(`#board-grid .rail-btn[data-si="${si}"]`);
      el?.scrollIntoView({ block: "center", inline: "nearest" });
      el?.closest(".rail")?.animate?.([{ background: "var(--accent)" }, { background: "var(--rail)" }], { duration: 1400 });
    });
  }
  function scrollToCol(n) {
    requestAnimationFrame(() => $(`#board-grid .colhead-btn[data-s="${n}"]`)?.scrollIntoView({ block: "nearest", inline: "center" }));
  }

  /* ============================================================
     Actions
     ============================================================ */
  function setView(v) {
    st.view = v; if (v !== "board" && st.pick) st.pick = null;
    hideFloat(); render(); if (v === "board") scrollToPinned();
  }
  function pin(name) { st.pinned = name; }
  function toggleEdit() {
    if (st.locked) { toast("The schedule is locked", "Unlock it to make changes."); return; }
    if (st.edit && ops.length) {
      toast(`Save or discard ${plural(ops.length, "pending change")} first`, "They are in the tray at the bottom of the board.");
      $("#tray").animate?.([{ transform: "translateY(-4px)" }, { transform: "none" }], { duration: 300 });
      return;
    }
    st.edit = !st.edit; st.pick = null;
    if (st.edit && st.view !== "board") st.view = "board";
    render();
    toast(st.edit ? "Editing the schedule" : "Editing finished", st.edit ? "Drag tags to swap desks. Changes wait in the tray until you save." : "");
  }
  function save() {
    if (!ops.length) return;
    const n = ops.length;
    const moved = new Set(ops.flatMap(o => o.changes.map(c => o.slot + "|" + c.supplier)));
    build();
    base = W.appts.map(a => ({ ...a, hand: a.hand || moved.has(a.slot + "|" + a.supplier), pending: false }));
    savedChanges += n; ops = [];
    rebase(); commit();
    toast(`Saved ${plural(n, "change")}`, `${D.event.manualChanges + savedChanges} manual changes applied in total.`);
  }
  function discard() {
    const n = ops.length; ops = []; st.pick = null; commit();
    toast(`Discarded ${plural(n, "change")}`, "The board is back to the last saved schedule.");
  }
  function undo() {
    const o = ops.pop(); if (!o) return; commit();
    toast("Undid one change", o.label);
  }
  function runMatching() {
    const manual = D.event.manualChanges + savedChanges;
    openDialog({
      title: "Run matching again?",
      body: `<p>This rebuilds all ${W.appts.length} appointments from the latest rankings and replaces the board, including ${plural(manual, "manual change")}${ops.length ? ` and ${plural(ops.length, "pending change")}` : ""}.</p>
        <ul class="grid grid-cols-2 gap-x-4 gap-y-1 text-[12.5px] text-foreground border border-border rounded-md p-3 bg-background">
          <li>Supplier target: <b>${S.supplierTarget}</b></li><li>Buyer range: <b>${S.buyerMin} to ${S.buyerMax}</b></li>
          <li>Buyer ideal: <b>${S.buyerIdeal}</b></li><li>Mutual top: <b>${S.mutualTopN}</b></li>
          <li class="col-span-2">Hotel rank cutoff: <b>${S.hotelRankCutoff}</b></li></ul>`,
      actions: [{ label: "Cancel" }, { label: "Run matching", variant: "btn-default", onClick: () => toast("Matching started", `Rebuilding ${W.appts.length} appointments. The board refreshes when it finishes.`) }]
    });
  }
  function lockFlow() {
    if (st.locked) { st.locked = false; render(); toast("Schedule unlocked", "Editing is available again."); return; }
    if (ops.length) {
      openDialog({ title: "Save or discard changes first", body: `<p>There ${ops.length === 1 ? "is 1 pending change" : `are ${ops.length} pending changes`} on the board. Locking needs a saved schedule.</p>`, actions: [{ label: "Keep editing", variant: "btn-default" }] });
      return;
    }
    const m = metricsCache();
    openDialog({
      title: "Lock this schedule?",
      body: `<p>Editing turns off and the export becomes the version that gets emailed to buyers and suppliers. You can unlock it later.</p>
        ${m.alerts ? `<div data-slot="alert" role="note" class="rounded-md border border-warning bg-warning-soft px-3 py-2 text-[12.5px] text-foreground">${m.below.length ? `${plural(m.below.length, "buyer")} still below ${S.buyerMin} meetings. ` : ""}${m.above.length ? `${plural(m.above.length, "buyer")} above ${S.buyerMax}. ` : ""}${m.supOff.length ? `${plural(m.supOff.length, "supplier")} not at ${S.supplierTarget}.` : ""}</div>` : ""}`,
      actions: [{ label: "Cancel" }, { label: "Lock schedule", variant: "btn-default", onClick: () => { st.locked = true; st.edit = false; st.pick = null; render(); toast("Schedule locked", "Exports now use this version."); } }]
    });
  }
  function exportMenu(btn) {
    if (!pop.hidden) { closePopover(); return; }
    const items = [
      { k: "master", t: "Master schedule", s: `Excel workbook, ${W.appts.length} appointments across ${NS} slots` },
      { k: "buyers", t: "Buyer schedules", s: `One PDF per buyer, ${BUY.length} files` },
      { k: "suppliers", t: "Supplier schedules", s: `One PDF per desk, ${SUP.length} files` }
    ];
    openPopover(btn, `<div role="menu" data-slot="dropdown-menu-content" aria-label="Export">${items.map(i => `<button class="menu-item" role="menuitem" data-export="${i.k}">${i.t}<small>${i.s}</small></button>`).join("")}</div>
      <p class="px-2.5 pt-1.5 pb-1 text-[11.5px] text-muted-foreground">${st.locked ? "Exporting the locked schedule." : "The schedule is not locked yet, so exports are marked draft."}</p>`);
    $$("[data-export]", pop).forEach(b => b.addEventListener("click", () => {
      const it = items.find(i => i.k === b.dataset.export); closePopover();
      toast(`Exporting ${it.t.toLowerCase()}`, it.s + (st.locked ? "." : ", marked draft."));
    }));
  }

  /* ============================================================
     Events
     ============================================================ */
  $("#btn-run").addEventListener("click", runMatching);
  $("#btn-edit").addEventListener("click", toggleEdit);
  $("#btn-lock").addEventListener("click", lockFlow);
  $("#btn-export").addEventListener("click", e => exportMenu(e.currentTarget));
  $("#btn-cmdk").addEventListener("click", openCmd);
  $("#cmdk-kbd").textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl K";

  $("#tabs").addEventListener("click", e => { const t = e.target.closest("[data-view]"); if (t) setView(t.dataset.view); });
  $("#tabs").addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    const i = VIEWS.findIndex(v => v.id === st.view), n = (i + (e.key === "ArrowRight" ? 1 : -1) + VIEWS.length) % VIEWS.length;
    setView(VIEWS[n].id); $(`#tab-${VIEWS[n].id}`).focus();
  });

  let qTimer = 0;
  $("#search").addEventListener("input", e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { st.q = e.target.value; render(); }, 90);
  });
  $("#search-clear").addEventListener("click", () => { $("#search").value = ""; st.q = ""; render(); $("#search").focus(); });
  $("#free").addEventListener("change", e => { st.free = +e.target.value; render(); if (st.free && st.view === "board") scrollToCol(st.free); });

  // one delegated handler for everything rendered
  document.addEventListener("click", e => {
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest("#btn-export")) closePopover();
    const t = e.target.closest("[data-act], .chip[data-s]");
    if (!t) return;
    const act = t.dataset.act;
    const edit = st.edit && !st.locked;

    if (t.classList.contains("chip") && t.dataset.si != null) {
      const n = +t.dataset.s, si = +t.dataset.si, s = SUP[si].name;
      st.focus = { s: n, si };
      if (edit) {
        if (!st.pick) {
          st.pick = { type: "seat", slot: n, supplier: s };
          renderBoard(); renderTray(); icons(); focusChip(n, si);
          return;
        }
        const ok = applyAt(n, s);
        if (ok === false) showVerdict(t, evaluate(st.pick, n, s));
        return;
      }
      const a = W.seatAt(n, s);
      pin(a.buyer); hideFloat();
      render(); focusChip(n, si);
      openSheet({ kind: "appt", slot: n, supplier: s, tab: "buyer" });
      return;
    }
    switch (act) {
      case "free-col": { const n = +t.dataset.s; st.free = st.free === n ? 0 : n; render(); break; }
      case "bench": {
        const b = BUY[+t.dataset.bi], n = +t.dataset.s;
        if (edit) { st.pick = { type: "buyer", buyer: b.name, from: n }; pin(b.name); render(); toast(`Holding ${who(b.name)}`, "Click a desk to seat them. Outlined desks are allowed."); }
        else { pin(b.name); render(); openSheet({ kind: "buyer", name: b.name }); }
        break;
      }
      case "bench-toggle": st.benchOpen = !st.benchOpen; renderBoard(); icons(); break;
      case "insert": { st.pick = { type: "buyer", buyer: st.pinned, from: +t.dataset.s }; render(); scrollToCol(+t.dataset.s); break; }
      case "pin-tag":
        if (edit) { st.pick = st.pick?.type === "buyer" && st.pick.buyer === st.pinned ? null : { type: "buyer", buyer: st.pinned, from: 0 }; render(); }
        else openSheet({ kind: "buyer", name: st.pinned });
        break;
      case "unpin": st.pinned = null; if (st.pick?.type === "buyer") st.pick = null; render(); break;
      case "open-buyer": openSheet({ kind: "buyer", name: BUY[+t.dataset.bi].name }); break;
      case "open-sup": case "sup": openSheet({ kind: "supplier", name: SUP[+t.dataset.si].name }); break;
      case "appt": openSheet({ kind: "appt", slot: +t.dataset.s, supplier: SUP[+t.dataset.si].name, tab: st.sheet?.tab || "buyer" }); break;
      case "sheet-tab": st.sheet.tab = t.dataset.tab; renderSheet(); icons(); break;
      case "close-sheet": st.sheet = null; renderSheet(); break;
      case "pin-board": { const b = BUY[+t.dataset.bi]; pin(b.name); if (window.innerWidth < 1100) st.sheet = null; setView("board"); toast(`Pinned ${who(b.name)}`, "Their tags are green. Ringed columns are their open slots."); break; }
      case "show-row": { const si = +t.dataset.si; if (window.innerWidth < 1100) st.sheet = null; setView("board"); scrollToRow(si); break; }
      case "find-seat": {
        const b = BUY[+t.dataset.bi], n = +t.dataset.s;
        pin(b.name); st.pick = { type: "buyer", buyer: b.name, from: n };
        if (window.innerWidth < 1100) st.sheet = null;
        setView("board"); scrollToCol(n); break;
      }
      case "cancel-pick": cancelPick(); render(); break;
      case "undo": undo(); break;
      case "discard": discard(); break;
      case "save": save(); break;
      case "clear-filters": st.q = ""; st.free = 0; $("#search").value = ""; render(); break;
      case "goto-board": setView("board"); break;
    }
  });
  $("#sheet-backdrop").addEventListener("click", () => { st.sheet = null; renderSheet(); });
  $("#list-view").addEventListener("change", e => { if (e.target.id === "sort") { st.sort = e.target.value; renderBuyers(); icons(); } });

  // hover card and live verdicts
  let hoverTimer = 0;
  const grid = $("#board-grid");
  function chipFromEvent(e) { return e.target.closest?.(".chip[data-si]"); }
  function preview(el) {
    const n = +el.dataset.s, s = SUP[+el.dataset.si].name;
    if (st.pick) showVerdict(el, evaluate(st.pick, n, s));
    else { const a = W.seatAt(n, s); if (a) showCard(el, a); }
  }
  grid.addEventListener("mouseover", e => {
    const el = chipFromEvent(e);
    clearTimeout(hoverTimer);
    if (!el) return;
    hoverTimer = setTimeout(() => preview(el), st.pick ? 0 : 380);
  });
  grid.addEventListener("mouseleave", () => { clearTimeout(hoverTimer); if (!dragging) hideFloat(); });
  grid.addEventListener("focusin", e => { const el = chipFromEvent(e); if (el) { st.focus = { s: +el.dataset.s, si: +el.dataset.si }; if (st.pick || el.matches(":focus-visible")) preview(el); } });
  grid.addEventListener("focusout", () => { if (!st.pick) hideFloat(); });
  $("#board-scroll").addEventListener("scroll", () => { if (!dragging) hideFloat(); }, { passive: true });

  // arrow-key navigation over the grid (roving tabindex)
  grid.addEventListener("keydown", e => {
    const el = chipFromEvent(e);
    if (!el) return;
    let n = +el.dataset.s, si = +el.dataset.si;
    const k = e.key;
    if (k === "ArrowRight") n = Math.min(NS, n + 1);
    else if (k === "ArrowLeft") n = Math.max(1, n - 1);
    else if (k === "ArrowDown") si = Math.min(SUP.length - 1, si + 1);
    else if (k === "ArrowUp") si = Math.max(0, si - 1);
    else if (k === "Home") n = 1;
    else if (k === "End") n = NS;
    else if (k === "PageDown") si = Math.min(SUP.length - 1, si + 10);
    else if (k === "PageUp") si = Math.max(0, si - 10);
    else return;
    e.preventDefault();
    focusChip(n, si);
  });

  // drag and drop (desktop). Click-to-pick covers touch and keyboard.
  let dragging = false, lastOver = null;
  function startDrag(e, pick) {
    if (!(st.edit && !st.locked)) { e.preventDefault(); return; }
    dragging = true; st.pick = pick;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "aw-tag");
    clearTimeout(hoverTimer); hideFloat();
    setTimeout(() => { applyVerdicts(); renderTray(); icons(); }, 0);
  }
  document.addEventListener("dragstart", e => {
    const chip = e.target.closest?.(".chip[data-si]");
    if (chip) return startDrag(e, { type: "seat", slot: +chip.dataset.s, supplier: SUP[+chip.dataset.si].name });
    const tag = e.target.closest?.(".tag[data-bi]");
    if (tag) { pin(BUY[+tag.dataset.bi].name); return startDrag(e, { type: "buyer", buyer: BUY[+tag.dataset.bi].name, from: +tag.dataset.s }); }
    const pt = e.target.closest?.(".pin-tag");
    if (pt && st.pinned) return startDrag(e, { type: "buyer", buyer: st.pinned, from: 0 });
  });
  grid.addEventListener("dragover", e => {
    if (!dragging || !st.pick) return;
    const el = chipFromEvent(e);
    if (lastOver && lastOver !== el) lastOver.removeAttribute("data-over");
    if (!el) { hideFloat(); lastOver = null; return; }
    const v = evaluate(st.pick, +el.dataset.s, SUP[+el.dataset.si].name);
    if (v.status === "ok" || v.status === "warn") { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }
    if (lastOver !== el) {
      lastOver = el;
      if (v.status !== "none") el.dataset.over = v.status; else el.removeAttribute("data-over");
      showVerdict(el, v);
    }
  });
  grid.addEventListener("drop", e => {
    e.preventDefault();
    const el = chipFromEvent(e);
    if (!el || !st.pick) return;
    const n = +el.dataset.s, s = SUP[+el.dataset.si].name;
    const v = evaluate(st.pick, n, s);
    dragging = false;
    if (v.status === "ok" || v.status === "warn") {
      const pick = st.pick;
      setTimeout(() => { st.pick = pick; applyAt(n, s); }, 30);
      st.pick = null;
    } else {
      if (v.status === "blocked") toast(v.title, v.lines[0], "blocked");
      setTimeout(() => { cancelPick(); render(); }, 30);
    }
  });
  document.addEventListener("dragend", () => {
    if (!dragging) return;
    dragging = false; lastOver = null;
    setTimeout(() => { if (st.pick) { cancelPick(); render(); } }, 40);
  });

  // keyboard shortcuts
  document.addEventListener("keydown", e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); return; }
    if (e.key === "/" && !typing && !cmdk.open && !dlg.open) { e.preventDefault(); $("#search").focus(); return; }
    if (e.key === "Escape" && !cmdk.open && !dlg.open) {
      if (!pop.hidden) { closePopover(); return; }
      if (st.pick) { cancelPick(); render(); return; }
      if (st.sheet) { st.sheet = null; renderSheet(); return; }
      if (st.pinned) { st.pinned = null; render(); }
    }
  });
  cmdIn.addEventListener("input", () => { cmdSel = 0; renderCmd(); });
  cmdIn.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      cmdSel = (cmdSel + (e.key === "ArrowDown" ? 1 : -1) + cmdItems.length) % Math.max(1, cmdItems.length);
      $$(".cmd-item", cmdList).forEach(b => b.setAttribute("aria-selected", String(+b.dataset.ci === cmdSel)));
      $(`.cmd-item[data-ci="${cmdSel}"]`, cmdList)?.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") { e.preventDefault(); chooseCmd(cmdSel); }
  });
  cmdList.addEventListener("click", e => { const b = e.target.closest(".cmd-item"); if (b) chooseCmd(+b.dataset.ci); });
  cmdk.addEventListener("click", e => { if (e.target === cmdk) cmdk.close(); });
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  window.addEventListener("resize", () => { hideFloat(); closePopover(); });

  /* ============================================================
     Boot
     ============================================================ */
  build(); rebase(); render();
  window.addEventListener("load", icons);
})();
</script>
</body>
</html>
